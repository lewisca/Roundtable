    position: fixed; inset: 0; z-index: 60;
    background: radial-gradient(120% 120% at 50% 0%, #f7eddb 0%, #efe2c9 100%);
    display: flex; flex-direction: column; gap: clamp(10px, 1.4vw, 16px);

<script>
"use strict";

// Mixpanel event helper — safe no-op if the library is blocked/unavailable.
// While opted out (default until consent), Mixpanel drops these itself.
// snake_case names, lowercase string values, numeric values unquoted.
function track(name, props) {
  try { if (window.mixpanel && window.mixpanel.track) window.mixpanel.track(name, props || {}); } catch (e) {}
}
// Consent gate: opt in/out of all analytics. Opted out until the user accepts.
function applyConsent(granted) {
  try {
    if (!window.mixpanel) return;
    if (granted) window.mixpanel.opt_in_tracking(); else window.mixpanel.opt_out_tracking();
  } catch (e) {}
}

/* =========================================================================
   Roundtable — a collaborative family-reunion tree.
   Implemented from the "Family Reunion Tree v2" design concept.
   Zero dependencies: a tiny keyed virtual-DOM (focus/caret preserving) plus
   a faithful port of the concept's state machine, with real localStorage
   persistence so boards survive reloads.
   ========================================================================= */

/* ---------------------------- tiny vdom ---------------------------------- */
function h(tag, props, ...kids) {
  const children = [];
  const push = k => {
    if (k == null || k === false || k === true) return;
    if (Array.isArray(k)) { k.forEach(push); return; }
    if (typeof k === "object" && k.tag !== undefined) children.push(k);
    else children.push({ text: String(k) });
  };
  kids.forEach(push);
  return { tag, props: props || {}, children, key: (props && props.key) };
}

function makeEl(vn) {
  if (vn.text !== undefined) return document.createTextNode(vn.text);
  const el = document.createElement(vn.tag);
  patchProps(el, {}, vn.props);
  vn._el = el;
  vn.children.forEach(c => el.appendChild(makeEl(c)));
  return el;
}

function setStyle(el, css) {
  if (el._base === css) return;
  el._base = css || "";
  el.style.cssText = el._base;
}
function ensureHover(el) {
  if (el._hoverBound) return;
  el._hoverBound = true;
  el.addEventListener("mouseenter", () => {
    if (el._hover) el.style.cssText = (el._base || "") + ";" + el._hover;
  });
  el.addEventListener("mouseleave", () => { el.style.cssText = el._base || ""; });
}

function patchProps(el, oldP, newP) {
  // remove gone props
  for (const k in oldP) if (!(k in newP)) {
    if (k === "onClick") el.onclick = null;
    else if (k === "onInput" || k === "onChange") el.oninput = null;
    else if (k.startsWith("on")) el[k.toLowerCase()] = null;
    else if (k !== "key" && k !== "hover" && k !== "style") el.removeAttribute(k);
  }
  for (const k in newP) {
    const v = newP[k];
    if (k === "key") continue;
    else if (k === "style") setStyle(el, v);
    else if (k === "hover") { el._hover = v; ensureHover(el); }
    else if (k === "class") el.className = v;
    else if (k === "onClick") el.onclick = v;
    else if (k === "onInput" || k === "onChange") el.oninput = v;
    else if (k.startsWith("on")) el[k.toLowerCase()] = v;
    else if (k === "value") { if (el.value !== v) el.value = v == null ? "" : v; }
    else if (k === "checked") { el.checked = !!v; }
    else if (v == null || v === false) el.removeAttribute(k);
    else el.setAttribute(k, v === true ? "" : v);
  }
}

function sameType(a, b) {
  if (a.text !== undefined || b.text !== undefined) return a.text !== undefined && b.text !== undefined;
  return a.tag === b.tag && a.key === b.key;
}

function patch(parent, oldVn, newVn, index) {
  const existing = parent.childNodes[index];
  if (!oldVn) { parent.appendChild(makeEl(newVn)); return; }
  if (!newVn) { if (existing) parent.removeChild(existing); return; }
  if (!sameType(oldVn, newVn)) {
    const fresh = makeEl(newVn);
    parent.replaceChild(fresh, existing);
    return;
  }
  if (newVn.text !== undefined) {
    if (oldVn.text !== newVn.text && existing) existing.nodeValue = newVn.text;
    newVn._el = existing;
    return;
  }
  const el = existing;
  newVn._el = el;
  patchProps(el, oldVn.props, newVn.props);
  // `raw` elements have their children managed imperatively (e.g. injected SVG) —
  // don't let the vdom reconcile/trim them away.
  if (!(newVn.props && newVn.props.raw)) patchChildren(el, oldVn.children, newVn.children);
}

function patchChildren(el, oldKids, newKids) {
  const keyed = newKids.length && newKids[0].key != null;
  if (keyed) {
    // build map of old keyed nodes
    const oldByKey = new Map();
    oldKids.forEach(k => { if (k.key != null) oldByKey.set(k.key, k); });
    let domIndex = 0;
    newKids.forEach(nk => {
      const ok = oldByKey.get(nk.key);
      if (ok && ok._el) {
        // move into place if needed
        const target = el.childNodes[domIndex];
        if (target !== ok._el) el.insertBefore(ok._el, target || null);
        patch(el, ok, nk, domIndex);
        oldByKey.delete(nk.key);
      } else {
        const fresh = makeEl(nk);
        el.insertBefore(fresh, el.childNodes[domIndex] || null);
      }
      domIndex++;
    });
    // remove leftovers
    oldByKey.forEach(ok => { if (ok._el && ok._el.parentNode === el) el.removeChild(ok._el); });
    // trim any excess
    while (el.childNodes.length > newKids.length) el.removeChild(el.lastChild);
    return;
  }
  const max = Math.max(oldKids.length, newKids.length);
  for (let i = 0; i < max; i++) patch(el, oldKids[i], newKids[i], i);
  while (el.childNodes.length > newKids.length) el.removeChild(el.lastChild);
}

  render() {
    const V = this.renderVals();

    if (!this._vnode) {

  // Show the generation-filter scroll arrows only when the row overflows.
  syncGenArrows() {
    const el = document.getElementById("gen-scroll");
    const L = document.getElementById("gen-arrow-left");
    const R = document.getElementById("gen-arrow-right");
    if (!el || !L || !R) return;
    const overflow = el.scrollWidth - el.clientWidth > 2;
    L.style.display = (overflow && el.scrollLeft > 1) ? "flex" : "none";
    R.style.display = (overflow && el.scrollLeft + el.clientWidth < el.scrollWidth - 1) ? "flex" : "none";

  /* ---- radial (circular) view — read-only overview ------------------ */
  radialData() {
    const people = this.state.people;
    const kidsOf = pid => people.filter(p => (p.parentId || null) === (pid || null));
    // `gen` is the person's ABSOLUTE generation (0-based), so colours stay tied
    // to real generations even when zoomed into a branch.
    const mk = (p, g) => ({ id: p.id, name: p.name, short: (p.name || "?").trim().split(/\s+/)[0], gen: g, c: kidsOf(p.id).map(k => mk(k, g + 1)) });
    const fp = this.state.radialFocus ? people.find(p => p.id === this.state.radialFocus) : null;
    if (fp) { const base = this.depthOf(fp); return { id: fp.id, name: fp.name, short: (fp.name || "?").trim().split(/\s+/)[0], gen: base, focused: true, c: kidsOf(fp.id).map(k => mk(k, base + 1)) }; }
    const fam = this.state.familyName || "Family";
    return { id: "__center", name: fam, short: (fam.split(/\s+/)[0] || "Family"), gen: -1, c: kidsOf(null).map(k => mk(k, 0)) };
  },
  radialLayout(root) {
    const weigh = n => { n.w = n.c.length ? n.c.reduce((s, k) => s + weigh(k), 0) : 1; return n.w; };
    weigh(root);
    const out = [];
    const walk = (node, depth, a0, a1, parent) => {
      const rec = { node: node, depth: depth, a0: a0, a1: a1, mid: (a0 + a1) / 2, parent: parent };
      out.push(rec);
      let a = a0;
      node.c.forEach(k => { const span = (a1 - a0) * (k.w / node.w); walk(k, depth + 1, a, a + span, rec); a += span; });
      return rec;
    };
    walk(root, 0, -Math.PI / 2, Math.PI * 1.5, null);
    return out;
  },
  radialSVG() {
    const root = this.radialData();
    const nodes = this.radialLayout(root);
    const maxD = nodes.reduce((m, n) => Math.max(m, n.depth), 0);
    const SIZE = 700, cx = 350, cy = 350, R0 = 60;
    const BAND = (SIZE / 2 - R0 - 26) / Math.max(1, maxD);
    const rIn = d => R0 + (d - 1) * BAND, rOut = d => R0 + d * BAND;
    const pol = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    const arc = (r0, r1, a0, a1) => {
      const lg = a1 - a0 > Math.PI ? 1 : 0;
      const [x0, y0] = pol(r0, a0), [x1, y1] = pol(r0, a1), [x2, y2] = pol(r1, a1), [x3, y3] = pol(r1, a0);
      return "M" + x0 + " " + y0 + "A" + r0 + " " + r0 + " 0 " + lg + " 1 " + x1 + " " + y1 + "L" + x2 + " " + y2 + "A" + r1 + " " + r1 + " 0 " + lg + " 0 " + x3 + " " + y3 + "Z";
    };
    const selId = this.state.radialSel;
    const selRec = selId ? nodes.find(n => n.node.id === selId) : null;
    const dimActive = selRec && selRec.depth > 0;   // only fade siblings when an actual wedge is picked
    const lineage = {}; { let cur = selRec; while (cur) { lineage[cur.node.id] = true; cur = cur.parent; } }
    const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    let s = '<svg viewBox="0 0 ' + SIZE + " " + SIZE + '" style="width:100%;height:auto;display:block">';
    for (let i = 0; i < maxD; i++) s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + rOut(i + 1) + '" fill="none" stroke="#dcd3c4" stroke-width="1"/>';
    nodes.filter(n => n.depth > 0).forEach(n => {
      const c = this.gen(Math.max(0, n.node.gen)).color;   // colour by ABSOLUTE generation
      const dim = dimActive && !lineage[n.node.id];
      const isSel = selRec && selRec.node.id === n.node.id;
      const r0 = rIn(n.depth), r1 = rOut(n.depth), pad = 0.008;
      const [lx, ly] = pol((r0 + r1) / 2, n.mid);
      const arcW = (n.a1 - n.a0) * ((r0 + r1) / 2);   // tangential space along the arc
      // Tangential label: text follows the arc (uses its horizontal length) and
      // stays inside its own ring, then flipped so it's never upside-down.
      let rot = (n.mid * 180) / Math.PI + 90;
      const rn = ((rot % 360) + 360) % 360;
      if (rn > 90 && rn < 270) rot += 180;
      s += '<g data-node="' + esc(n.node.id) + '" style="cursor:pointer">';
      s += '<path d="' + arc(r0 + 3, r1 - 3, n.a0 + pad, n.a1 - pad) + '" fill="' + c + '" fill-opacity="' + (dim ? 0.16 : isSel ? 1 : 0.82) + '" stroke="#f5ead8" stroke-width="2.5"/>';
      {
        // Always show at least the first letter; fit more when the arc allows.
        const fs = Math.min(15, Math.max(9, (r1 - r0) / 2.4));
        const maxChars = Math.max(1, Math.floor(arcW / (fs * 0.62)));
        const label = maxChars <= 1 ? n.node.short.slice(0, 1)
          : (n.node.short.length > maxChars ? n.node.short.slice(0, maxChars - 1) + "…" : n.node.short);
        s += '<text x="' + lx + '" y="' + ly + '" transform="rotate(' + rot + ", " + lx + ", " + ly + ')" text-anchor="middle" dominant-baseline="middle" fill="' + (dim ? "#00000033" : "#fff") + '" style="font-size:' + fs + 'px;font-weight:700;pointer-events:none">' + esc(label) + "</text>";
      }
      s += "</g>";
    });
    const focused = !!root.focused;
    // The hub shows the focused person's own generation colour (family centre = accent).
    const hubColor = focused ? this.gen(Math.max(0, root.gen)).color : this.accent();
    s += '<g' + (focused ? ' data-node="__up" style="cursor:pointer"' : "") + ">";
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R0 + '" fill="' + hubColor + '"/>';
    if (focused) s += '<text x="' + cx + '" y="' + (cy - R0 + 20) + '" text-anchor="middle" fill="#ffffffcc" style="font-size:13px;pointer-events:none">↑ back</text>';
    s += '<text x="' + cx + '" y="' + (cy + (focused ? 8 : 5)) + '" text-anchor="middle" fill="#fff" style="font-size:' + (root.short.length > 9 ? 14 : 17) + 'px;font-weight:700;font-family:Caprasimo,serif;pointer-events:none">' + esc(root.short) + "</text>";
    s += "</g>";
    s += "</svg>";
    return s;
  },
  syncRadial() {
    if (this.state.viewMode !== "radial" || this.state.step !== "app") return;
    const host = document.getElementById("radial-host");
    if (!host) return;
    const sig = this.state.people.map(p => p.id + ":" + (p.parentId || "")).join(",") + "|" + (this.state.radialSel || "") + "|" + (this.state.radialFocus || "") + "|" + this.state.familyName;
    if (host._sig === sig) return;
    host._sig = sig;
    host.innerHTML = this.radialSVG();
  },

  /* ---- persistence -------------------------------------------------- */
  persist() {
    const s = this.state;
    if (s.step !== "app") { try { localStorage.setItem("roundtable:session", JSON.stringify({ step: s.step, myName: s.myName, contact: s.contact })); } catch (e) {} return; }
    const snap = this.boardSnapshot();
    try {
      localStorage.setItem(STORE_PREFIX + s.room, JSON.stringify(snap));
      localStorage.setItem("roundtable:session", JSON.stringify({ step: s.step, room: s.room, myName: s.myName, contact: s.contact }));
    } catch (e) {}
    this.saveRemote(s.room, snap);
  },

  /* ---- Supabase sync (real shared boards + realtime) ---------------- */
  saveRemote(room, snap) {
    // Demo board stays local-only; wait until the initial remote load is done
    // so a freshly-entered empty board can't clobber the real one.
    if (!sb || room === DEMO_ROOM || !this._remoteReady) return;
    const json = JSON.stringify(snap);
    if (json === this._lastWriteJSON) return; // board data unchanged (UI-only edit)
    clearTimeout(this._saveTimer);
    this._saveTimer = setTimeout(async () => {
      this._lastWriteJSON = json;
      try { await sb.from("boards").upsert({ code: room, data: snap }); } catch (e) {}
    }, 600);
  },
  boardSnapshot() {
    // The tree blob only — `subscribed`/paid status is a server-controlled
    // column (is_paid), never trusted from this client-writable JSON.
    const s = this.state;
    return {
      familyName: s.familyName, people: s.people, feed: s.feed, log: s.log,
      thread: s.thread, fresh: s.fresh, collapsed: s.collapsed, links: s.links
    };
  },
  async syncRoom(room, isNew) {
    if (!sb || room === DEMO_ROOM) { this._remoteReady = true; return; }
    this.subscribeRoom(room);
    try {
      const { data, error } = await sb.from("boards").select("*").eq("code", room).maybeSingle();
      if (error) throw error;
      if (this.state.room !== room || this.state.step !== "app") return; // navigated away
      if (data && data.data) {
        // adopt the shared board that already exists
        this._lastWriteJSON = JSON.stringify(data.data);
        Object.assign(this.state, data.data);
        this.applyBilling(data);   // paid status/expiry from server columns (not the blob)
        try { localStorage.setItem(STORE_PREFIX + room, JSON.stringify(data.data)); } catch (e) {}
        this._remoteReady = true;
        this.render();
      } else {
        // board doesn't exist yet — create it from the current (local) state
        this._remoteReady = true;
        this.persist();
      }
    } catch (e) {
      this._remoteReady = true; // offline/error: fall back to local, retry on next edit
    }
  },
  subscribeRoom(room) {
    if (!sb) return;
    this.unsubscribeRoom();
    if (!this._clientId) this._clientId = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : "c" + Math.random().toString(36).slice(2) + Date.now();
    this.state.hereCount = 1;
    const self = this;
    this._chan = sb.channel("board:" + room, { config: { presence: { key: this._clientId } } })
      .on("postgres_changes", { event: "*", schema: "public", table: "boards", filter: "code=eq." + room }, payload => {
        if (this.state.room !== room || this.state.step !== "app") return;
        const row = payload.new;
        if (!row) return;
        let changed = false;
        const incoming = row.data;
        if (incoming) {
          const json = JSON.stringify(incoming);
          if (json !== this._lastWriteJSON) {   // skip our own change echoing back
            this._lastWriteJSON = json;
            Object.assign(this.state, incoming);
            try { localStorage.setItem(STORE_PREFIX + room, JSON.stringify(incoming)); } catch (e) {}
            changed = true;
          }
        }
        // server-controlled billing columns (e.g. Stripe webhook flips is_paid)
        if (this.applyBilling(row)) changed = true;
        if (changed) this.render();
      })
      // Live presence: count everyone currently connected to this board.
      .on("presence", { event: "sync" }, () => {
        try {
          const n = Object.keys(self._chan.presenceState()).length || 1;
          if (self.state.hereCount !== n) {
            self.state.hereCount = n;
            if (self.state.step === "app" && self.state.room === room) self.render();
          }
        } catch (e) {}
      })
      .subscribe(status => {
        if (status === "SUBSCRIBED") {
          try { self._chan.track({ name: self.state.myName || "Someone", cid: self._clientId }); } catch (e) {}
        }
      });
  },
  // Reflect the server-owned billing/lifecycle columns into UI state. Returns
  // true if anything changed. Tolerant of the columns not existing yet (undefined).
  applyBilling(row) {
    const paid = !!row.is_paid;
    const exp = row.expires_at || null;
    const until = row.paid_until || null;
    const owner = row.owner_email || null;
    const changed = paid !== this.state.subscribed || exp !== this.state.expiresAt ||
                    until !== this.state.paidUntil || owner !== this.state.ownerEmail;
    this.state.subscribed = paid;
    this.state.expiresAt = exp;
    this.state.paidUntil = until;
    this.state.ownerEmail = owner;
    return changed;
  },
  unsubscribeRoom() {
    if (sb && this._chan) { try { sb.removeChannel(this._chan); } catch (e) {} }
    this._chan = null;
  },
  loadRoom(room) {
    const raw = localStorage.getItem(STORE_PREFIX + room);
    if (raw) { try { return JSON.parse(raw); } catch (e) {} }
    if (room === DEMO_ROOM) return { familyName: SEED.familyName, people: clone(SEED.people), feed: clone(SEED.feed), log: clone(SEED.log), thread: clone(SEED.thread), fresh: {}, collapsed: {}, subscribed: false };
    return null;
  },
  enterRoom(room, isNew) {
    const data = this.loadRoom(room);
    if (data) {
      Object.assign(this.state, {
        room, step: "app", shared: true, selected: null, sheet: null, tick: 0, undoStack: [], query: "", genView: "all", viewMode: "list", radialSel: null, radialFocus: null, toast: null,
        familyName: data.familyName || "", people: data.people || [], feed: data.feed || [],
        log: data.log || [], thread: data.thread || clone(SEED.thread), fresh: data.fresh || {},
        collapsed: data.collapsed || {}, links: data.links || [], connectFor: null, subscribed: !!data.subscribed
      });
    } else {
      // brand-new board — created boards get a 3-generation starter template so
      // people don't face a blank canvas; joins to an unknown code stay empty.
      const started = { who: this.state.myName || "You", i: this.initials(this.state.myName || "You"), c: "#201e1d", verb: "started", target: "board " + room, kind: "board", when: this.stamp() };
      Object.assign(this.state, {
        room, step: "app", shared: true, selected: null, sheet: null, tick: 0, undoStack: [], query: "", genView: "all", viewMode: "list", radialSel: null, radialFocus: null, toast: null,
        familyName: "", people: isNew ? this.templatePeople() : [], feed: [], log: [started], thread: [], fresh: {}, collapsed: {}, links: [], connectFor: null, subscribed: false
      });
    }
    this.startLive();
    this.unsubscribeRoom();       // drop any previous board's realtime channel
    this._remoteReady = false;   // block remote writes until the real board is loaded
    this.persist();
    this.render();
    this.syncRoom(room, isNew);
  },

  /* ---- helpers (ported) --------------------------------------------- */
  presence() { return "avatars"; },
  accent() { return ACCENT; },
  gen(d) { return GEN[d % GEN.length]; },
  initials(n) { return (n || "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?"; },
  // A person's partners as a list. Back-compatible with the old single `partner`.
  partnersOf(p) { return (p && p.partners) ? p.partners : (p && p.partner && p.partner.name ? [p.partner] : []); },
  years(p) {
    if (!p) return "";
    if (p.born && p.died) return p.born + " – " + p.died;
    if (p.born) return "b. " + p.born;
    if (p.died) return "d. " + p.died;
    return "";
  },
  kidsOf(id) { return this.state.people.filter(p => p.parentId === id); },
  below(id) { return this.kidsOf(id).reduce((t, k) => t + 1 + this.below(k.id), 0); },
  depthOf(p) { let d = 0, cur = p; const by = id => this.state.people.find(x => x.id === id); while (cur && cur.parentId) { cur = by(cur.parentId); d++; if (d > 12) break; } return d; },
  newCode() {
    const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let out = "";
    for (let i = 0; i < 6; i++) out += a[Math.floor(Math.random() * a.length)];
    return out;
  },
  plusDays(n) {
    const d = new Date(Date.now() + n * 86400000);
    const mo = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][d.getMonth()];
    return mo + " " + d.getDate() + ", " + d.getFullYear();
  },
  fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const mo = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][d.getMonth()];
    return mo + " " + d.getDate() + ", " + d.getFullYear();
  },
  stamp() {
    const d = new Date();
    const mo = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][d.getMonth()];
    let hh = d.getHours(), ap = hh >= 12 ? "PM" : "AM";
    hh = hh % 12 || 12;
    return mo + " " + d.getDate() + ", " + d.getFullYear() + " · " + hh + ":" + String(d.getMinutes()).padStart(2, "0") + " " + ap;
  },
  logEntry(st, verb, target, kind, detail, who, i, c) {
    return [{
      who: who || (st.myName || "You"), i: i || this.initials(st.myName || "You"), c: c || "#201e1d",
      verb, target, kind, detail: detail || null, when: this.stamp()
    }].concat(st.log);
  },
  flashToast() { clearTimeout(this._toastTimer); this._toastTimer = setTimeout(() => this.setState({ toast: null }), 4200); },

  startLive() {
    clearInterval(this._liveTimer);
    // simulated live collaborators only on the shared sample board
    if (this.state.room !== DEMO_ROOM) return;
    this._liveTimer = setInterval(() => this.liveTick(), 9000);
  },
  liveTick() {
    if (this.state.step !== "app" || this.state.room !== DEMO_ROOM) return;
    const ev = SCRIPT[this.state.tick % SCRIPT.length];
    this.setState(s => {
      let people = s.people.slice();
      let freshId = null;
      if (ev.person && !people.some(p => p.id === ev.person.id)) { people.push(clone(ev.person)); freshId = ev.person.id; }
      if (ev.patch) { people = people.map(p => p.id === ev.patch.id ? Object.assign({}, p, clone(ev.patch)) : p); freshId = ev.patch.id; }
      const fresh = Object.assign({}, s.fresh);
      if (freshId) fresh[freshId] = ev.who;
      return {
        people, fresh, tick: s.tick + 1,
        feed: [{ who: ev.who, i: ev.i, c: ev.c, text: ev.text, t: ev.t }].concat(s.feed),
        log: this.logEntry(s, ev.person ? "added" : "edited", ev.person ? ev.person.name : (ev.patch ? (s.people.find(p => p.id === ev.patch.id) || {}).name : ""), ev.person ? "add" : "edit", ev.logDetail || null, ev.who, ev.i, ev.c),
        toast: { text: ev.who + " " + ev.text, i: ev.i, c: ev.c }
      };
    });
    this.flashToast();
  },

  pushUndo() { this.setState(s => ({ undoStack: s.undoStack.slice(-9).concat([clone(s.people)]) })); },

  // 3-generation starter skeleton for a freshly created board. Each is a
  // fill-in prompt (placeholder:true) — editable to a real name, or removable.
  templatePeople() {
    const by = this.state.myName || "You";
    return [
      { id: "tpl-gp", parentId: null, name: "Add a Grandparent", placeholder: true, addedBy: by },
      { id: "tpl-p", parentId: "tpl-gp", name: "Add a Parent", placeholder: true, addedBy: by },
      { id: "tpl-me", parentId: "tpl-p", name: "Add Yourself", placeholder: true, addedBy: by }
    ];
  },
  openNew(parentId, kind) {
    this.pushUndo();
    this.setState({ sheet: "edit", editId: null, editIsNew: true, editParent: parentId, editParentOf: null, addKind: kind || null, draftName: "", draftBorn: "", draftDied: "", draftPlace: "", draftNote: "", draftPartners: [], draftCoParent: "", draftMore: false, draftPhoto: "" });
  },
  // Insert a new person ABOVE `id`: the new person takes `id`'s old parent
  // (or becomes a root), and `id` becomes its child. Handles "I added myself
  // first, now add my parent" and any missed parent on any node.
  openParent(id) {
    this.pushUndo();
    const child = this.state.people.find(p => p.id === id);
    this.setState({ sheet: "edit", editId: null, editIsNew: true, editParent: (child ? (child.parentId || null) : null), editParentOf: [id], addKind: "parent", draftName: "", draftBorn: "", draftDied: "", draftPlace: "", draftNote: "", draftPartners: [], draftCoParent: "", draftMore: false, draftPhoto: "" });
  },
  // The + button on a card opens a small menu to add a child, parent, or sibling.
  openAddMenu(id) { this.setState({ sheet: "add", addForId: id, selected: id }); },
  // Optional: email/text the board code + expiry to the person on create/join.
  // Best-effort — needs the `notify-board` Edge Function deployed (see README).
  async notifyBoard(code, contact) {
    const c = (contact || "").trim();
    if (!sb || !c) return;
    try {
      const { error } = await sb.functions.invoke("notify-board", { body: { code, contact: c } });
      if (!error) this.setState({ toast: { text: "Board code sent to " + c, i: "✉", c: this.accent() } }, () => this.flashToast());
    } catch (e) {}
  },
  // Adding a parent when the person has siblings: choose who the parent belongs to.
  openParentPick(id) { this.setState({ sheet: "parentpick", parentPickFor: id, parentPickSel: { [id]: true } }); },
  confirmParentPick() {
    const s = this.state;
    const ids = Object.keys(s.parentPickSel).filter(k => s.parentPickSel[k]);
    if (!ids.length) return;
    const anchor = s.people.find(p => p.id === s.parentPickFor);
    this.setState({
      sheet: "edit", editId: null, editIsNew: true,
      editParent: (anchor ? (anchor.parentId || null) : null), editParentOf: ids, addKind: "parent",
      draftName: "", draftBorn: "", draftDied: "", draftPlace: "", draftNote: "", draftPartners: [], draftCoParent: "", draftMore: false, draftPhoto: ""
    });
  },
  openEdit(id) {
    const p = this.state.people.find(x => x.id === id);
    const partners = this.partnersOf(p).map(pp => ({ name: pp.name || "", born: pp.born || "", died: pp.died || "", place: pp.place || "" }));
    this.setState({
      sheet: "edit", editId: id, editIsNew: false, editParentOf: null, addKind: null,
      draftName: p.placeholder ? "" : p.name, draftBorn: p.born || "", draftDied: p.died || "", draftPlace: p.place || "",
      draftNote: p.note || "", draftPartners: partners, draftCoParent: p.coParent || "",
      draftMore: !!(partners.length || p.born || p.died || p.place || p.note),
      draftPhoto: p.photo || ""
    });
  },
  // Read an image file and downscale it (max 640px, aspect kept) to a light JPEG
  // that still syncs cheaply in the board data. Avatars crop it to a circle with
  // object-fit; the full frame shows when the photo is tapped to enlarge.
  readPhoto(file, cb) {
    if (!file) { cb(null); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const max = 640;
          let w = img.width, h = img.height;
          if (w > max || h > max) { const s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          cb(c.toDataURL("image/jpeg", 0.72));
        } catch (e) { cb(null); }
      };
      img.onerror = () => cb(null);
      img.src = reader.result;
    };
    reader.onerror = () => cb(null);
    reader.readAsDataURL(file);
  },
  // Open the OS file picker. The input MUST be in the DOM or mobile Safari fires
  // the change event unreliably (works once, then not) — so attach, click inside
  // the tap, and clean up afterward.
  pickPhoto() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.style.cssText = "position:fixed; left:-9999px; top:0; width:1px; height:1px; opacity:0";
    const done = () => { try { input.remove(); } catch (e) {} };
    input.addEventListener("change", () => {
      const f = input.files && input.files[0];
      done();
      if (!f) return;
      this.readPhoto(f, (url) => {
        if (url) this.setState({ draftPhoto: url });
        else this.setState({ toast: { text: "Couldn't read that image — try another", i: "!", c: "#8c491a" } }, () => this.flashToast());
      });
    });
    // If the picker is dismissed with no choice, remove the stray input on refocus.
    const onFocus = () => { window.removeEventListener("focus", onFocus); setTimeout(() => { if (!input.files || !input.files.length) done(); }, 600); };
    window.addEventListener("focus", onFocus);
    document.body.appendChild(input);
    input.click();
  },
  /* ---- Project (full-screen for a TV / projector) ---------------------- */

  closeProjection() {

  },
  saveEdit() {
    const s = this.state, name = s.draftName.trim();
    if (!name) return;
    const partners = (s.draftPartners || [])
      .map(pp => ({ name: (pp.name || "").trim(), born: pp.born || "", died: pp.died || "", place: pp.place || "" }))
      .filter(pp => pp.name);
    const fields = {
      name, born: s.draftBorn, died: s.draftDied, place: s.draftPlace, note: s.draftNote,
      partners: partners, partner: null,               // partner[] is authoritative; clear legacy single
      coParent: s.draftCoParent ? s.draftCoParent : null,
      photo: s.draftPhoto || null
    };
    this.pushUndo();
    this.setState(st => {
      let people, toastText, dupFound = null;
      if (st.editIsNew) {
        const dup = st.people.find(p => p.name.toLowerCase() === name.toLowerCase());
        dupFound = dup || null;
        const newId = "p" + Date.now();
        const person = Object.assign({ id: newId, parentId: st.editParent || null, addedBy: st.myName || "You" }, fields);
        if (dup) { person.flag = true; }
        people = st.people.map(p => (dup && p.id === dup.id) ? Object.assign({}, p, { flag: true }) : p).concat([person]);
        // Inserting a parent: re-home the selected node(s) — and their subtrees — under the new person.
        const kidIds = Array.isArray(st.editParentOf) ? st.editParentOf : (st.editParentOf ? [st.editParentOf] : []);
        if (kidIds.length) {
          people = people.map(p => kidIds.indexOf(p.id) > -1 ? Object.assign({}, p, { parentId: newId }) : p);
          const first = (st.people.find(p => p.id === kidIds[0]) || {}).name;
          const who = kidIds.length === 1 ? ((first || "them").split(" ")[0]) : (kidIds.length + " people");
          toastText = dup ? name + " added above " + who + " — flagged next to " + dup.name : name + " added as " + who + (kidIds.length === 1 ? "'s parent" : "' parent");
        } else {
          toastText = dup ? name + " added — flagged next to " + dup.name + " for a chat" : name + " is on the tree";
        }
      } else {
        people = st.people.map(p => { if (p.id !== st.editId) return p; const m = Object.assign({}, p, fields); delete m.placeholder; return m; });
        toastText = "Saved " + name;
      }
      return {
        people, sheet: null, selected: null, editParentOf: null,
        feed: [{ who: st.myName || "You", i: this.initials(st.myName || "You"), c: "#201e1d", text: (st.editIsNew ? "added " : "edited ") + name, t: this.clock() }].concat(st.feed),
        log: this.logEntry(st, st.editIsNew ? "added" : "edited", name, st.editIsNew ? "add" : "edit",
          st.editIsNew ? (dupFound ? "flagged as a possible duplicate" : null) : "details changed"),
        toast: { text: toastText, i: this.initials(st.myName || "You"), c: "#201e1d" }
      };
    });
    this.flashToast();
    if (s.editIsNew) {   // VALUE MOMENT: a relative was added to the tree
      const kidIds = Array.isArray(s.editParentOf) ? s.editParentOf : (s.editParentOf ? [s.editParentOf] : []);
      const relation = kidIds.length ? "parent" : (s.addKind || (s.editParent ? "child" : "root"));
      track("person_added", { relation: relation, has_partner: partners.length > 0, demo: s.room === DEMO_ROOM });
    }
  },
  clock() { const d = new Date(); let hh = d.getHours() % 12 || 12; return hh + ":" + String(d.getMinutes()).padStart(2, "0"); },
  removePerson(mode) {
    const id = this.state.deleteId;
    const gone = this.state.people.find(p => p.id === id);
    if (!gone) return;
    this.pushUndo();
    const first = (gone.name || "someone").split(" ")[0];
    if (mode === "one") {
      // Remove just this person; promote their children up to this person's
      // parent (or make them roots), so the branch below survives.
      const newParent = gone.parentId || null;
      const kids = this.kidsOf(id).length;
      this.setState(s => ({
        people: this.resolveFlags(s.people
          .filter(p => p.id !== id)
          .map(p => p.parentId === id ? Object.assign({}, p, { parentId: newParent }) : p)),
        links: (s.links || []).filter(l => l.a !== id && l.b !== id),
        sheet: null, deleteId: null, selected: null,
        log: this.logEntry(s, "removed", gone.name, "remove",
          kids ? "kept the " + kids + " " + (kids === 1 ? "child" : "children") + " below, moved up a generation" : null),
        toast: { text: "Removed " + first + " — their branch stayed.", i: "↶", c: "#8c491a" }
      }));
    } else {
      const ids = [id].concat(this.descendants(id));
      const extra = ids.length - 1;
      this.setState(s => ({
        people: this.resolveFlags(s.people.filter(p => ids.indexOf(p.id) === -1)),
        links: (s.links || []).filter(l => ids.indexOf(l.a) === -1 && ids.indexOf(l.b) === -1),
        sheet: null, deleteId: null, selected: null,
        log: this.logEntry(s, "removed", gone.name, "remove",
          extra ? "and the " + extra + " " + (extra === 1 ? "person" : "people") + " below them" : null),
        toast: { text: "Removed.", i: "↶", c: "#8c491a" }
      }));
    }
    this.flashToast();
    track("person_removed", { mode: mode === "one" ? "one" : "subtree" });
  },
  descendants(id, out) {
    out = out || [];
    this.kidsOf(id).forEach(k => { out.push(k.id); this.descendants(k.id, out); });
    return out;
  },
  // A duplicate flag needs a pair. Once fewer than two flagged remain, clear it.
  resolveFlags(people) {
    return people.filter(p => p.flag).length < 2
      ? people.map(p => p.flag ? Object.assign({}, p, { flag: false }) : p)
      : people;
  },
  // Relationship links between two top-level people (spouse / sibling).
  linksOf(id) {
    return (this.state.links || []).filter(l => l.a === id || l.b === id).map(l => {
      const otherId = l.a === id ? l.b : l.a;
      const other = this.state.people.find(p => p.id === otherId);
      return other ? { otherId: otherId, otherName: other.name, type: l.type } : null;
    }).filter(Boolean);
  },
  openConnect(id) { this.setState({ sheet: "connect", connectFor: id, connectType: "spouse" }); },
  addLink(a, b, type) {
    if (!a || !b || a === b) return;
    this.pushUndo();
    this.setState(st => {
      const dup = (st.links || []).some(l => l.type === type && ((l.a === a && l.b === b) || (l.a === b && l.b === a)));
      const links = dup ? st.links : (st.links || []).concat([{ a: a, b: b, type: type }]);
      const nameA = (st.people.find(p => p.id === a) || {}).name || "someone";
      const nameB = (st.people.find(p => p.id === b) || {}).name || "someone";
      const verb = type === "spouse" ? "married to" : "a sibling of";
      return {
        links: links, sheet: null, selected: null, connectFor: null,
        log: this.logEntry(st, "connected", nameA + " · " + verb + " · " + nameB, "edit", "linked at the top of the tree"),
        toast: { text: nameA + " — " + verb + " " + nameB, i: "⚭", c: this.accent() }
      };
    }, () => this.flashToast());
  },
  unlink(a, b, type) {
    this.pushUndo();
    this.setState(st => ({
      links: (st.links || []).filter(l => !(l.type === type && ((l.a === a && l.b === b) || (l.a === b && l.b === a))))
    }));
  },
  pruneLinks(people) {
    const ids = {}; people.forEach(p => { ids[p.id] = true; });
    return (this.state.links || []).filter(l => ids[l.a] && ids[l.b]);
  },

  flatten(forBig, expandAll) {
    const s = this.state, q = s.query.trim().toLowerCase();
    const ind = forBig ? 42 : 21;
    // Indent per generation, but taper deep levels so long names keep a usable
    // width on a narrow phone. Connectors are derived from these offsets, so
    // they stay aligned whatever the taper.
    const cap = forBig ? 99 : 4, stepAfter = forBig ? ind : 8;
    const indentAt = d => d <= cap ? d * ind : cap * ind + (d - cap) * stepAfter;
    const stub = (a, b) => Math.max(6, Math.round((indentAt(a) - indentAt(b)) * 0.55));
    const rows = [];
    // Generation filter: null = full tree; a number = flat list of just that generation.
    const genView = (!forBig && typeof s.genView === "number") ? s.genView : null;
    const matches = p => !q || [p.name, p.place, p.note, this.partnersOf(p).map(pp => pp.name).join(" "), p.coParent, p.born, p.addedBy].filter(Boolean).join(" ").toLowerCase().indexOf(q) > -1;
    const walk = (parentId, depth) => {
      const list = this.kidsOf(parentId);
      const parentP = parentId ? s.people.find(x => x.id === parentId) : null;
      const parentName = parentP ? parentP.name : null;
      list.forEach((p, i) => {
        const g = this.gen(depth);
        const collapsed = !expandAll && !!s.collapsed[p.id] && !q;
        const kids = this.kidsOf(p.id);
        const isFresh = !!s.fresh[p.id];
        const detail = [p.place, p.note].filter(Boolean).join(" · ");
        const flat = genView !== null;   // one-generation view is a flat list, no connectors
        if (genView === null || depth === genView) {
          rows.push({
            isCard: true, isAdd: false, id: p.id, name: p.name, years: this.years(p),
            placeholder: !!p.placeholder,
            initials: p.placeholder ? "＋" : this.initials(p.name), photo: p.placeholder ? null : (p.photo || null),
            onPhoto: (!p.placeholder && p.photo) ? (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ lightbox: { photo: p.photo, name: p.name } }); } : null,
            detail: detail,
            partners: this.partnersOf(p).map(pp => ({ name: pp.name, years: this.years(pp) })),
            coParent: p.coParent || null,
            childOf: (flat && parentName) ? parentName : null,   // shown only in the generation view
            links: this.linksOf(p.id).map(l => Object.assign({}, l, {
              onJump: () => {
                this.setState({ selected: l.otherId });
                const el = document.getElementById("node-" + l.otherId);
                if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
              },
              onUnlink: () => this.unlink(p.id, l.otherId, l.type)
            })),
            color: g.color, soft: g.soft, depth: depth, pad: flat ? 0 : indentAt(depth),
            ribLeft: flat ? 0 : (depth ? indentAt(depth - 1) + 6 : 0), ribW: flat ? 0 : (depth ? stub(depth, depth - 1) : Math.round(ind * 0.55)),
            ribColor: this.gen(Math.max(0, depth - 1)).color,
            showRib: !flat && depth > 0, showSpine: !flat && depth > 0 && i < list.length - 1,
            borderColor: s.selected === p.id ? g.color : (isFresh ? this.accent() : (matches(p) && q ? g.color : "#dcd3c4")),
            borderW: s.selected === p.id ? 3 : (isFresh || (q && matches(p)) ? 2 : 1),
            dim: q && !matches(p) ? 0.32 : 1,
            hasKids: !flat && kids.length > 0, below: this.below(p.id),
            chevron: collapsed ? "▸" : "▾",
            selected: s.selected === p.id,
            flagged: !!p.flag,
            onFlag: () => this.setState({ sheet: "flag" }),
            byLine: p.placeholder ? "tap to fill in" : (isFresh ? "just added by " + s.fresh[p.id] : "added by " + (p.addedBy || "someone")),
            byColor: p.placeholder ? "#c67139" : (isFresh ? this.accent() : "#c0b6a5"),
            onToggle: () => this.setState(st => ({ collapsed: Object.assign({}, st.collapsed, { [p.id]: !st.collapsed[p.id] }) })),
            onSelect: () => this.setState(st => ({ selected: st.selected === p.id ? null : p.id })),
            onAdd: () => this.openNew(p.id),
            onEdit: () => this.openEdit(p.id),
            onSibling: () => this.openNew(p.parentId),
          onAddParent: () => this.openParent(p.id),
          onPlus: () => this.openAddMenu(p.id),
            onDelete: () => this.setState({ sheet: "delete", deleteId: p.id })
          });
        }
        if (flat) {
          if (depth < genView) walk(p.id, depth + 1);   // keep descending until we reach the chosen generation
        } else if (!collapsed && kids.length) {
          walk(p.id, depth + 1);   // add-a-child is the + on each card, not an inline row
        }
      });
    };
    walk(null, 0);
    return rows;
  },

  renderVals() {
    const s = this.state;
    const realPeople = s.people.filter(p => !p.placeholder);   // starter-template prompts don't count as real people
    const anyPlaceholder = realPeople.length !== s.people.length;
    const total = realPeople.length + realPeople.reduce((n, p) => n + this.partnersOf(p).filter(pp => pp.name).length, 0);
    const gens = s.people.reduce((m, p) => Math.max(m, this.depthOf(p) + 1), 1);
    const genCounts = [];
    s.people.forEach(p => { const d = this.depthOf(p); genCounts[d] = (genCounts[d] || 0) + 1; });
    const genFilters = [{ key: "all", label: "All", color: this.accent(), count: null }]
      .concat(Array.from({ length: gens }, (_, d) => ({ key: d, label: "Gen " + (d + 1), color: this.gen(d).color, count: genCounts[d] || 0 })))
      .map(o => ({
        label: o.label, count: o.count, color: o.color,
        active: (o.key === "all") ? (s.genView === "all") : (s.genView === o.key),
        onPick: () => this.setState({ genView: o.key, selected: null })
      }));
    const legend2 = Array.from({ length: gens }, (_, d) => ({ color: this.gen(d).color, label: "Gen " + (d + 1) }));
    let radialDetail = null;
    if (s.radialSel) {
      const rp = s.people.find(x => x.id === s.radialSel);
      if (rp) {
        const sp = (this.partnersOf(rp)[0] || {}).name;
        const kc = s.people.filter(x => x.parentId === rp.id).length;
        const meta = [this.years(rp), sp ? ("♥ " + sp) : null, kc ? (kc + " " + (kc === 1 ? "child" : "children")) : null].filter(Boolean).join(" · ");
        const byId = id => s.people.find(x => x.id === id);
        const path = []; let cur = rp;
        while (cur) { path.unshift(cur.name.split(/\s+/)[0]); cur = cur.parentId ? byId(cur.parentId) : null; }
        path.unshift((s.familyName || "Family").split(/\s+/)[0]);
        radialDetail = { name: rp.name, meta: meta, path: path.join("  ›  ") };
      }
    }
    // breadcrumb for the zoomed-in (focused) branch, tappable to jump levels
    let radialFocusPath = null;
    if (s.viewMode === "radial" && s.radialFocus) {
      const byId = id => s.people.find(x => x.id === id);
      const chain = []; let cur = byId(s.radialFocus);
      while (cur) { chain.unshift(cur); cur = cur.parentId ? byId(cur.parentId) : null; }
      radialFocusPath = [{ name: (s.familyName || "Family").split(/\s+/)[0], onJump: () => this.setState({ radialFocus: null, radialSel: null }) }]
        .concat(chain.map(p => ({ name: p.name.split(/\s+/)[0], onJump: () => this.setState({ radialFocus: p.id, radialSel: p.id }) })));
    }
    const rows = this.flatten(false);
    const anyMatch = rows.some(r => r.isCard && r.dim === 1);
    // Rows view — everyone grouped by generation (a flat, addable directory)
    const genGroups = (() => {
      const q = s.query.trim().toLowerCase();
      const matches = p => !q || [p.name, p.place, p.note, this.partnersOf(p).map(pp => pp.name).join(" "), p.coParent, p.born, p.addedBy].filter(Boolean).join(" ").toLowerCase().indexOf(q) > -1;
      const only = (typeof s.genView === "number") ? s.genView : null;   // gen filter: null = all
      const byGen = {};
      s.people.forEach(p => { if (!matches(p)) return; const d = this.depthOf(p); (byGen[d] = byGen[d] || []).push(p); });
      return Object.keys(byGen).map(Number).sort((a, b) => a - b).filter(d => only === null || d === only).map(d => {
        const g = this.gen(d);
        return {
          gen: d, label: "Gen " + (d + 1), color: g.color, soft: g.soft,
          countLabel: byGen[d].length + " " + (byGen[d].length === 1 ? "person" : "people"),
          people: byGen[d].map((p, i) => ({
            id: p.id, num: String(i + 1).padStart(2, "0"),
            placeholder: !!p.placeholder,
            initials: p.placeholder ? "＋" : this.initials(p.name),
            photo: p.placeholder ? null : (p.photo || null),
            onPhoto: (!p.placeholder && p.photo) ? (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ lightbox: { photo: p.photo, name: p.name } }); } : null,
            name: p.name, years: this.years(p),
            // when a single generation is shown, name each person's parent (like the Branches view)
            childOf: (only !== null && p.parentId) ? ((s.people.find(x => x.id === p.parentId) || {}).name || null) : null,
            partners: this.partnersOf(p).map(pp => pp.name).filter(Boolean),
            coParent: p.coParent || null,
            offspring: this.below(p.id),
            byLine: p.placeholder ? "tap to fill in" : "added by " + (p.addedBy || "someone"),
            byColor: p.placeholder ? "#c67139" : "#c0b6a5",
            onOpen: () => this.openEdit(p.id),
            onAddChild: () => this.openNew(p.id, "child"),
          })),
        };
      });
    })();
    const rowsSummary = total + " " + (total === 1 ? "person" : "people") + " · " + gens + " " + (gens === 1 ? "gen" : "gens");
    const contributors = [
      { name: (s.myName || "You") + " (you)", i: this.initials(s.myName || "You"), c: "#201e1d", when: "now" },
      { name: "Rita", i: "R", c: "#c67139", when: "1m ago" },
      { name: "Tío Tomás", i: "T", c: "#7a8a5e", when: "2m ago" },
      { name: "Danny", i: "D", c: "#8c491a", when: "4m ago" },
      { name: "Javi", i: "J", c: "#82796a", when: "6m ago" }
    ];
    const dupName = (s.editIsNew && s.draftName.trim())
      ? (s.people.find(p => p.name.toLowerCase() === s.draftName.trim().toLowerCase()) || {}).name : null;
    // For the "other parent" picker: the partners of this person's parent.
    const editingPerson = s.editId ? s.people.find(p => p.id === s.editId) : null;
    const coParentId = s.editIsNew ? s.editParent : (editingPerson ? editingPerson.parentId : null);
    const coParentPerson = coParentId ? s.people.find(p => p.id === coParentId) : null;
    const coParentOptions = coParentPerson ? this.partnersOf(coParentPerson).map(pp => pp.name).filter(Boolean) : [];
    const delP = s.deleteId ? s.people.find(p => p.id === s.deleteId) : null;
    const delBelow = s.deleteId ? this.below(s.deleteId) : 0;
    const delParent = delP && delP.parentId ? s.people.find(p => p.id === delP.parentId) : null;
    const delParentFirst = delParent ? delParent.name.split(" ")[0] : null;
    const addForP = s.addForId ? s.people.find(p => p.id === s.addForId) : null;
    const connectP = s.connectFor ? s.people.find(p => p.id === s.connectFor) : null;
    const connectOthers = connectP ? s.people.filter(p => !p.parentId && p.id !== connectP.id).map(p => ({
      id: p.id, name: p.name, years: this.years(p),
      onConnect: () => this.addLink(connectP.id, p.id, this.state.connectType)
    })) : [];
    const connectExisting = connectP ? this.linksOf(connectP.id).map(l => ({
      otherName: l.otherName, type: l.type,
      onUnlink: () => this.unlink(connectP.id, l.otherId, l.type)

    const ppAnchor = s.parentPickFor ? s.people.find(p => p.id === s.parentPickFor) : null;
    let parentPickList = [], parentPickAllOn = false, parentPickCount = 0;
    if (ppAnchor) {
      const pid = ppAnchor.parentId || null;
      const sibs = s.people.filter(x => (x.parentId || null) === pid && x.id !== ppAnchor.id);
      parentPickAllOn = sibs.length > 0 && sibs.every(x => s.parentPickSel[x.id]);
      parentPickList = [{ id: ppAnchor.id, name: ppAnchor.name, years: this.years(ppAnchor), isAnchor: true, checked: true }]
        .concat(sibs.map(x => ({
          id: x.id, name: x.name, years: this.years(x), isAnchor: false, checked: !!s.parentPickSel[x.id],
          onToggle: () => this.setState(st => ({ parentPickSel: Object.assign({}, st.parentPickSel, { [x.id]: !st.parentPickSel[x.id] }) }))
        })));
      parentPickCount = parentPickList.filter(r => r.checked).length;
    }
    const showContrib = s.room === DEMO_ROOM ? contributors : contributors.slice(0, 1);

    return {
      isLanding: s.step === "landing",
      isName: s.step === "name", isBoardSetup: s.step === "board", isApp: s.step === "app",
      beats: [
        { n: "1", c: "#c67139", title: "Say who you are", body: "Your name rides along with everyone you add." },
        { n: "2", c: "#7a8a5e", title: "Add your branch", body: "A name is enough — details whenever you like." },
        { n: "3", c: "#8c491a", title: "Watch it fill in", body: "Multiple phones, one tree. Duplicates get flagged, never overwritten." }
      ],
      onStartNow: () => this.setState({ step: "name", joining: false }),

  copy(text) { try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (e) {} },

  downloadTree(kind, total) {
    // Real, free export: a self-contained printable HTML of the whole tree.
    const s = this.state;
    const rows = this.flatten(false, true).filter(r => r.isCard);
    const esc = t => String(t == null ? "" : t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const rowHtml = rows.map(r => `<div style="display:flex;align-items:flex-start;gap:10px;margin-left:${r.depth * 22}px;padding:8px 12px;border-left:5px solid ${r.color};margin-bottom:6px">
        ${r.photo
          ? `<img src="${r.photo}" alt="" style="width:38px;height:38px;flex:none;border-radius:50%;object-fit:cover;border:2px solid ${r.color}">`
          : `<span style="width:38px;height:38px;flex:none;border-radius:50%;background:${r.soft};border:2px solid ${r.color};color:${r.color};font-weight:700;font-size:13px;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center">${esc(r.initials)}</span>`}
        <div style="min-width:0">
          <strong style="font-size:16px">${esc(r.name)}</strong> <span style="color:#82796a">${esc(r.years)}</span>
          ${r.partners.map(pt => ` &nbsp;♥ ${esc(pt.name)} <span style="color:#82796a">${esc(pt.years)}</span>`).join("")}${r.coParent ? ` <span style="color:#82796a; font-style:italic">· with ${esc(r.coParent)}</span>` : ""}
          ${r.detail ? `<div style="color:#645c50;font-size:13px">${esc(r.detail)}</div>` : ""}
        </div>
      </div>`).join("");
    const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(s.familyName || "Family")} — Roundtable</title>
      <style>body{font-family:Georgia,serif;color:#201e1d;max-width:820px;margin:40px auto;padding:0 24px;background:#f5ead8}
      h1{font-size:38px;margin:0}h2{margin-top:40px}@media print{body{background:#fff}}</style></head>
      <body onload="${kind === 'pdf' ? 'window.print()' : ''}">
      <div style="text-transform:uppercase;letter-spacing:.16em;color:#8c491a;font-size:12px">Board ${esc(s.room)} · ${esc(total)} people</div>
      <h1>${esc(s.familyName || "Our Family")}</h1>
      <h2>The tree</h2>${rowHtml}
      <p style="color:#82796a;font-size:12px;margin-top:30px">Made with Roundtable — the family tree you build together.</p>
      </body></html>`;
    const blob = new Blob([doc], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (s.familyName || "family").replace(/[^a-z0-9]+/gi, "-").toLowerCase() + "-tree.html";
    if (kind === "pdf") { window.open(url, "_blank"); }
    else { document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    this.setState(st => ({
      sheet: null,
      log: this.logEntry(st, "downloaded", kind === "pdf" ? "the tree as a PDF" : "the tree as an image", "export"),
      toast: { text: kind === "pdf" ? "Printable sheet opened — " + total + " people" : "Tree saved — open it any time", i: "✓", c: this.accent() }
    }), () => this.flashToast());
  },

  // Renders the whole tree to a real PNG (native SVG → canvas),
  // so "Download as image" produces an actual image of the tree. Falls back to
  // the printable HTML if the browser can't export the canvas.
  downloadImage(total) {
    const s = this.state;
    const rows = this.flatten(false, true).filter(r => r.isCard);
    const esc = t => String(t == null ? "" : t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const W = 980, P = 46, headTop = 58, treeTop = 132, rowH = 66;
    const treeH = rows.length * rowH;
    const H = treeTop + treeH + 46;
    let b = "";
    b += `<rect x="0" y="0" width="${W}" height="${H}" fill="#f5ead8"/>`;
    b += `<text x="${P}" y="${headTop}" font-family="Georgia,serif" font-weight="bold" font-size="40" fill="#201e1d">${esc(s.familyName || "Our Family")}</text>`;
    b += `<text x="${P}" y="${headTop + 30}" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#8c491a">BOARD ${esc(s.room)} · ${esc(total)} PEOPLE</text>`;
    rows.forEach((r, i) => {
      const y = treeTop + i * rowH;
      const x = P + Math.min(r.depth, 6) * 28;
      const midY = y + 23;
      b += `<rect x="${x}" y="${y}" width="6" height="${rowH - 16}" rx="3" fill="${r.color}"/>`;
      const ax = x + 32;
      if (r.photo) {
        b += `<clipPath id="pc${i}"><circle cx="${ax}" cy="${midY}" r="17"/></clipPath>`;
        b += `<image x="${ax - 17}" y="${midY - 17}" width="34" height="34" preserveAspectRatio="xMidYMid slice" clip-path="url(#pc${i})" href="${r.photo}" xlink:href="${r.photo}"/>`;
        b += `<circle cx="${ax}" cy="${midY}" r="17" fill="none" stroke="${r.color}" stroke-width="2.5"/>`;
      } else {
        b += `<circle cx="${ax}" cy="${midY}" r="17" fill="${r.soft}" stroke="${r.color}" stroke-width="2.5"/>`;
        b += `<text x="${ax}" y="${midY + 4}" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="12" fill="${r.color}">${esc(r.initials)}</text>`;
      }
      const tx = ax + 30;
      b += `<text x="${tx}" y="${midY - 3}" font-family="Georgia,serif" font-weight="bold" font-size="20" fill="#201e1d">${esc(r.name)}<tspan font-family="Arial,sans-serif" font-weight="normal" font-size="12" fill="#82796a">   ${esc(r.years)}</tspan></text>`;
      const sub = [];
      r.partners.forEach(pt => sub.push("♥ " + pt.name + (pt.years ? " " + pt.years : "")));
      if (r.coParent) sub.push("with " + r.coParent);
      if (r.detail) sub.push(r.detail);
      if (sub.length) b += `<text x="${tx}" y="${midY + 15}" font-family="Arial,sans-serif" font-size="12" fill="#645c50">${esc(sub.join("   ·   "))}</text>`;
    });
    b += `<text x="${P}" y="${H - 20}" font-family="Arial,sans-serif" font-size="11" fill="#82796a">Made with Roundtable — the family tree you build together.</text>`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${b}</svg>`;
    const fname = ((s.familyName || "family").replace(/[^a-z0-9]+/gi, "-").toLowerCase().replace(/^-+|-+$/g, "") || "family") + "-tree.png";
    const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
    const finish = () => this.setState(st => ({
      sheet: null,
      log: this.logEntry(st, "downloaded", "the tree as an image", "export"),
      toast: { text: "Image saved — " + total + " people", i: "✓", c: this.accent() }
    }), () => this.flashToast());
    const img = new Image();
    img.onload = () => {
      try {
        const scale = 2, canvas = document.createElement("canvas");
        canvas.width = W * scale; canvas.height = H * scale;
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => {
          if (!blob) { this.downloadTree("image", total); return; }
          const purl = URL.createObjectURL(blob);
          const a = document.createElement("a"); a.href = purl; a.download = fname;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(purl), 60000);
          finish();
        }, "image/png");
      } catch (e) { URL.revokeObjectURL(url); this.downloadTree("image", total); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); this.downloadTree("image", total); };
    img.src = url;
  }
};

/* ------------------------------ boot ------------------------------------- */
(function () {
  App._root = document.getElementById("device");
  // Restore analytics consent (opted out by default until accepted).
  try {
    const cs = localStorage.getItem("roundtable:consent");
    App.state.consent = cs === "granted" ? true : cs === "denied" ? false : null;
    if (App.state.consent === true) applyConsent(true);
  } catch (e) {}
  // seed the sample board once so first-time visitors can explore it
  // (guarded: localStorage can throw in private mode / when storage is disabled)
  try {
    if (!localStorage.getItem(STORE_PREFIX + DEMO_ROOM)) {
      localStorage.setItem(STORE_PREFIX + DEMO_ROOM, JSON.stringify({
        familyName: SEED.familyName, people: SEED.people, feed: SEED.feed, log: SEED.log, thread: SEED.thread, fresh: {}, collapsed: {}, subscribed: false
      }));
    }
  } catch (e) {}
  // deep link from an emailed / shared board link: ?board=CODE (&paid=1 after Stripe)
  let deepCode = "", justPaid = false;
  try {
    const params = new URLSearchParams(location.search);
    deepCode = (params.get("board") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    justPaid = params.get("paid") === "1";
  } catch (e) {}
  // resume last session (or open the deep-linked board)
  try {
    const sess = JSON.parse(localStorage.getItem("roundtable:session") || "null");
    if (sess && sess.myName) App.state.myName = sess.myName;
    if (sess && sess.contact) App.state.contact = sess.contact;
    if (deepCode) {
      if (App.state.myName) {
        App.state.step = "landing";
        App.enterRoom(deepCode, false);        // known visitor -> straight into the board
        track("board_joined", { via: "link" });
      } else {
        App._deepLinkCode = deepCode;          // ask their name first, then open it
        App.state.step = "name";
        App.state.joining = true;
      }
    } else if (sess && sess.step === "app" && sess.room) {
      App.state.step = "landing"; // will enter cleanly below
      App.enterRoom(sess.room, false);
      App.state.myName = sess.myName || App.state.myName;
    }
  } catch (e) {}
  App._mq = window.matchMedia("(min-width: 1000px)");
  App.state.wide = App._mq.matches;
  App._mq.addEventListener("change", e => App.setState({ wide: e.matches }));
  window.addEventListener("resize", () => App.syncGenArrows());
  // Keep the Full-screen button label honest when the user leaves via Esc, and
  // re-arm the wake lock after the tab was hidden (browsers drop it automatically).
  document.addEventListener("fullscreenchange", () => { if (App.state.step === "app") App.setState({ tick: App.state.tick + 1 }); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && App.state.projection) App.requestWakeLock(); });
  App.render();
  if (App.state.step === "app") App.startLive();
  // Returned from Stripe Checkout: confirm, and let the webhook + realtime flip is_paid.
  if (justPaid) {
    try { history.replaceState({}, "", location.pathname + "?board=" + encodeURIComponent(deepCode || App.state.room)); } catch (e) {}
    App.state.toast = { text: "Payment received — activating your board. It stays live for a year.", i: "✓", c: "#7a8a5e" };
    App.render();
    App.flashToast();
    track("upgrade_completed", {});
  }
})();
