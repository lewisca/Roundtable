<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roundtable — the family tree you build together</title>
<meta name="description" content="Share one board code. Everyone fills in the branch they know best, and the tree keeps growing.">
<meta name="theme-color" content="#c67139">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #e4d9c2;
    font-family: Figtree, system-ui, -apple-system, sans-serif;
    color: #201e1d;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #8c491a; text-decoration: none; }
  a:hover { color: #b2622d; }
  ::selection { background: #ffe1d0; }
  input, button, textarea { font-family: inherit; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .noscroll::-webkit-scrollbar { display: none; }
  .noscroll { scrollbar-width: none; }

  /* Full-bleed cream page; the app sits in a centered readable column.
     Same cream on the page and the column, so there's no frame or card edge —
     it reads as one full-width site. Edge-to-edge on phones. */
  #stage {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background: #f5ead8;
  }
  #device {
    position: relative;
    width: 100%;
    max-width: 640px;
    height: 100dvh;
    background: #f5ead8;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* Projection View — read-only, full-window live display for a TV/projector */
  .proj {
    position: fixed; inset: 0; z-index: 60;
    background: radial-gradient(120% 120% at 50% 0%, #f7eddb 0%, #efe2c9 100%);
    display: flex; flex-direction: column; gap: 22px;
    padding: clamp(20px, 3vw, 46px);
    overflow: hidden;
    font-family: Figtree, system-ui, sans-serif; color: #201e1d;
    animation: riseIn .35s ease;
  }
  .proj-cols { flex: 1; min-height: 0; display: flex; gap: 28px; }
  .proj-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .proj-tree { flex: 1; overflow: auto; padding-right: 6px; }
  .proj-side { width: 340px; flex: none; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
  @media (max-width: 820px) {
    .proj-cols { flex-direction: column; gap: 18px; }
    .proj-side { width: auto; flex: 0 0 auto; max-height: 40%; }
  }
</style>
</head>
<body>
<div id="stage"><div id="device"></div></div>

<script>
"use strict";
/* =========================================================================
   Roundtable — a collaborative family-reunion tree.
   Implemented from the "Family Reunion Tree v2" design concept.
   Zero dependencies: a tiny keyed virtual-DOM (focus/caret preserving) plus
   a faithful port of the concept's state machine, with real localStorage
   persistence so boards survive reloads.
   ========================================================================= */

/* ---------------------------- tiny vdom ---------------------------------- */
function h(tag, props, ...kids) {
  const children = [];
  const push = k => {
    if (k == null || k === false || k === true) return;
    if (Array.isArray(k)) { k.forEach(push); return; }
    if (typeof k === "object" && k.tag !== undefined) children.push(k);
    else children.push({ text: String(k) });
  };
  kids.forEach(push);
  return { tag, props: props || {}, children, key: (props && props.key) };
}

function makeEl(vn) {
  if (vn.text !== undefined) return document.createTextNode(vn.text);
  const el = document.createElement(vn.tag);
  patchProps(el, {}, vn.props);
  vn._el = el;
  vn.children.forEach(c => el.appendChild(makeEl(c)));
  return el;
}

function setStyle(el, css) {
  if (el._base === css) return;
  el._base = css || "";
  el.style.cssText = el._base;
}
function ensureHover(el) {
  if (el._hoverBound) return;
  el._hoverBound = true;
  el.addEventListener("mouseenter", () => {
    if (el._hover) el.style.cssText = (el._base || "") + ";" + el._hover;
  });
  el.addEventListener("mouseleave", () => { el.style.cssText = el._base || ""; });
}

function patchProps(el, oldP, newP) {
  // remove gone props
  for (const k in oldP) if (!(k in newP)) {
    if (k === "onClick") el.onclick = null;
    else if (k === "onInput" || k === "onChange") el.oninput = null;
    else if (k.startsWith("on")) el[k.toLowerCase()] = null;
    else if (k !== "key" && k !== "hover" && k !== "style") el.removeAttribute(k);
  }
  for (const k in newP) {
    const v = newP[k];
    if (k === "key") continue;
    else if (k === "style") setStyle(el, v);
    else if (k === "hover") { el._hover = v; ensureHover(el); }
    else if (k === "class") el.className = v;
    else if (k === "onClick") el.onclick = v;
    else if (k === "onInput" || k === "onChange") el.oninput = v;
    else if (k.startsWith("on")) el[k.toLowerCase()] = v;
    else if (k === "value") { if (el.value !== v) el.value = v == null ? "" : v; }
    else if (k === "checked") { el.checked = !!v; }
    else if (v == null || v === false) el.removeAttribute(k);
    else el.setAttribute(k, v === true ? "" : v);
  }
}

function sameType(a, b) {
  if (a.text !== undefined || b.text !== undefined) return a.text !== undefined && b.text !== undefined;
  return a.tag === b.tag && a.key === b.key;
}

function patch(parent, oldVn, newVn, index) {
  const existing = parent.childNodes[index];
  if (!oldVn) { parent.appendChild(makeEl(newVn)); return; }
  if (!newVn) { if (existing) parent.removeChild(existing); return; }
  if (!sameType(oldVn, newVn)) {
    const fresh = makeEl(newVn);
    parent.replaceChild(fresh, existing);
    return;
  }
  if (newVn.text !== undefined) {
    if (oldVn.text !== newVn.text && existing) existing.nodeValue = newVn.text;
    newVn._el = existing;
    return;
  }
  const el = existing;
  newVn._el = el;
  patchProps(el, oldVn.props, newVn.props);
  patchChildren(el, oldVn.children, newVn.children);
}

function patchChildren(el, oldKids, newKids) {
  const keyed = newKids.length && newKids[0].key != null;
  if (keyed) {
    // build map of old keyed nodes
    const oldByKey = new Map();
    oldKids.forEach(k => { if (k.key != null) oldByKey.set(k.key, k); });
    let domIndex = 0;
    newKids.forEach(nk => {
      const ok = oldByKey.get(nk.key);
      if (ok && ok._el) {
        // move into place if needed
        const target = el.childNodes[domIndex];
        if (target !== ok._el) el.insertBefore(ok._el, target || null);
        patch(el, ok, nk, domIndex);
        oldByKey.delete(nk.key);
      } else {
        const fresh = makeEl(nk);
        el.insertBefore(fresh, el.childNodes[domIndex] || null);
      }
      domIndex++;
    });
    // remove leftovers
    oldByKey.forEach(ok => { if (ok._el && ok._el.parentNode === el) el.removeChild(ok._el); });
    // trim any excess
    while (el.childNodes.length > newKids.length) el.removeChild(el.lastChild);
    return;
  }
  const max = Math.max(oldKids.length, newKids.length);
  for (let i = 0; i < max; i++) patch(el, oldKids[i], newKids[i], i);
  while (el.childNodes.length > newKids.length) el.removeChild(el.lastChild);
}

/* ------------------------------- app ------------------------------------- */
const ACCENT = "#c67139";
const GEN = [
  { color: "#c67139", soft: "#ffe1d0", label: "Gen 1" },
  { color: "#7a8a5e", soft: "#e1eecc", label: "Gen 2" },
  { color: "#8c491a", soft: "#fff2eb", label: "Gen 3" },
  { color: "#645c50", soft: "#eee7db", label: "Gen 4" },
  { color: "#9a5b6d", soft: "#f2dfe4", label: "Gen 5" },
  { color: "#3f7d76", soft: "#d9ebe6", label: "Gen 6" },
  { color: "#a07d2c", soft: "#f1e7c8", label: "Gen 7" },
  { color: "#6d6796", soft: "#e7e5f0", label: "Gen 8" }
];

const SEED = {
  familyName: "Vanderhoven Family",
  thread: [
    { who: "Danny", i: "D", c: "#8c491a", text: "Aren’t these the same Camila? Mine has the Hale spelling." },
    { who: "Tío Tomás", i: "T", c: "#7a8a5e", text: "Hers is Reyes-Hale on the birth certificate. Let her pick." }
  ],
  people: [
    { id: "manuel", parentId: null, name: "Manuel Reyes", born: "1935", died: "2019", place: "Ponce, PR", note: "Same straw hat for thirty years", partner: { name: "Elena Reyes", born: "1938" }, addedBy: "Rita" },
    { id: "rosa", parentId: "manuel", name: "Rosa Hale", born: "1961", place: "Tampa, FL", partner: { name: "Gary Hale", born: "1959" }, addedBy: "Rita" },
    { id: "danny", parentId: "rosa", name: "Danny Hale", born: "1989", place: "Tampa, FL", addedBy: "Danny" },
    { id: "camila", parentId: "rosa", name: "Camila Hale", born: "1992", place: "Tampa, FL", addedBy: "Danny", flag: true },
    { id: "camila2", parentId: "rosa", name: "Camila Reyes-Hale", born: "1992", place: "Ponce, PR", addedBy: "Tío Tomás", flag: true },
    { id: "tomas", parentId: "manuel", name: "Tomás Reyes", born: "1963", place: "Chicago, IL", addedBy: "Rita" },
    { id: "javi", parentId: "tomas", name: "Javi Reyes", born: "1994", place: "Chicago, IL", addedBy: "Javi" },
    { id: "luz", parentId: "tomas", name: "Luz Reyes", born: "1998", place: "Chicago, IL", note: "Runs the dominoes table", addedBy: "Tío Tomás" },
    { id: "mari", parentId: "manuel", name: "Marisol Reyes", born: "1966", place: "Chicago, IL", addedBy: "Javi" }
  ],
  feed: [
    { who: "Tío Tomás", i: "T", c: "#7a8a5e", text: "added Luz Reyes", t: "2:11" },
    { who: "Rita", i: "R", c: "#c67139", text: "wrote a line about Manuel", t: "2:09" },
    { who: "Danny", i: "D", c: "#8c491a", text: "flagged two Camilas", t: "2:06" },
    { who: "Javi", i: "J", c: "#82796a", text: "joined from the picnic table", t: "2:02" }
  ],
  log: [
    { who: "Tío Tomás", i: "T", c: "#7a8a5e", verb: "added", target: "Luz Reyes", kind: "add", when: "Aug 3, 2026 · 2:11 PM" },
    { who: "Rita", i: "R", c: "#c67139", verb: "edited", target: "Manuel Reyes", detail: "added a line: “Same straw hat for thirty years”", kind: "edit", when: "Aug 3, 2026 · 2:09 PM" },
    { who: "Danny", i: "D", c: "#8c491a", verb: "flagged", target: "Camila Hale", detail: "possible duplicate of Camila Reyes-Hale", kind: "flag", when: "Aug 3, 2026 · 2:06 PM" },
    { who: "Tío Tomás", i: "T", c: "#7a8a5e", verb: "added", target: "Camila Reyes-Hale", kind: "add", when: "Aug 3, 2026 · 2:05 PM" },
    { who: "Danny", i: "D", c: "#8c491a", verb: "removed", target: "Gary Hale Jr.", detail: "added by mistake — no such person", kind: "remove", when: "Aug 3, 2026 · 2:04 PM" },
    { who: "Javi", i: "J", c: "#82796a", verb: "joined", target: "the board", kind: "board", when: "Aug 3, 2026 · 2:02 PM" },
    { who: "Rita", i: "R", c: "#c67139", verb: "started", target: "board V3L4Y2", kind: "board", when: "Aug 3, 2026 · 1:58 PM" }
  ]
};

const SCRIPT = [
  { who: "Rita", i: "R", c: "#c67139", text: "gave Marisol a partner — Pete Nakamura", logDetail: "partner recorded as Pete Nakamura, b. 1965", t: "2:15", patch: { id: "mari", partner: { name: "Pete Nakamura", born: "1965" } } },
  { who: "Danny", i: "D", c: "#8c491a", text: "added baby Sol", t: "2:16", person: { id: "sol", parentId: "danny", name: "Sol Hale", born: "2024", place: "Tampa, FL", addedBy: "Danny" } },
  { who: "Javi", i: "J", c: "#82796a", text: "filled in where Javi was born", logDetail: "note added: “Third-generation Cubs fan”", t: "2:17", patch: { id: "javi", note: "Third-generation Cubs fan" } }
];

const STORE_PREFIX = "roundtable:board:";
const DEMO_ROOM = "V3L4Y2";

const App = {
  state: {
    step: "landing",
    joining: false,
    codeInput: "",
    codeError: null,
    room: DEMO_ROOM,
    shared: true,
    myName: "",
    familyName: SEED.familyName,
    zoom: 1,
    projection: false,
    query: "",
    collapsed: {},
    selected: null,
    sheet: null,
    editId: null,
    editIsNew: false,
    editParent: null,
    deleteId: null,
    draftName: "", draftBorn: "", draftDied: "", draftPlace: "", draftNote: "",
    draftPartner: "", draftPartnerBorn: "", draftPartnerDied: "", draftPartnerPlace: "", draftMore: false,
    tick: 0,
    toast: null,
    fresh: {},
    replyText: "",
    thread: clone(SEED.thread),
    people: clone(SEED.people),
    feed: clone(SEED.feed),
    log: clone(SEED.log),
    undoStack: [],
    logFilter: "all",
    payEmail: "", payCard: "", payExp: "", payCvc: "", payName: "", payError: null, subscribed: false
  },

  _vnode: null,
  _root: null,
  _toastTimer: null,
  _liveTimer: null,

  setState(update, cb) {
    const patchObj = typeof update === "function" ? update(this.state) : update;
    Object.assign(this.state, patchObj);
    this.persist();
    this.render();
    if (cb) cb();
  },

  render() {
    const V = this.renderVals();
    const next = view(V);
    if (!this._vnode) {
      this._root.appendChild(makeEl(next));
    } else {
      patch(this._root, this._vnode, next, 0);
    }
    this._vnode = next;
  },

  /* ---- persistence -------------------------------------------------- */
  persist() {
    const s = this.state;
    if (s.step !== "app") { localStorage.setItem("roundtable:session", JSON.stringify({ step: s.step, myName: s.myName })); return; }
    const snap = {
      familyName: s.familyName, people: s.people, feed: s.feed, log: s.log,
      thread: s.thread, fresh: s.fresh, collapsed: s.collapsed, subscribed: s.subscribed
    };
    try { localStorage.setItem(STORE_PREFIX + s.room, JSON.stringify(snap)); } catch (e) {}
    localStorage.setItem("roundtable:session", JSON.stringify({ step: s.step, room: s.room, myName: s.myName }));
  },
  loadRoom(room) {
    const raw = localStorage.getItem(STORE_PREFIX + room);
    if (raw) { try { return JSON.parse(raw); } catch (e) {} }
    if (room === DEMO_ROOM) return { familyName: SEED.familyName, people: clone(SEED.people), feed: clone(SEED.feed), log: clone(SEED.log), thread: clone(SEED.thread), fresh: {}, collapsed: {}, subscribed: false };
    return null;
  },
  enterRoom(room, isNew) {
    const data = this.loadRoom(room);
    if (data) {
      Object.assign(this.state, {
        room, step: "app", shared: true, selected: null, sheet: null, tick: 0, undoStack: [], query: "", toast: null,
        familyName: data.familyName || "", people: data.people || [], feed: data.feed || [],
        log: data.log || [], thread: data.thread || clone(SEED.thread), fresh: data.fresh || {},
        collapsed: data.collapsed || {}, subscribed: !!data.subscribed
      });
    } else {
      // brand-new empty board
      const started = { who: this.state.myName || "You", i: this.initials(this.state.myName || "You"), c: "#201e1d", verb: "started", target: "board " + room, kind: "board", when: this.stamp() };
      Object.assign(this.state, {
        room, step: "app", shared: true, selected: null, sheet: null, tick: 0, undoStack: [], query: "", toast: null,
        familyName: "", people: [], feed: [], log: [started], thread: [], fresh: {}, collapsed: {}, subscribed: false
      });
    }
    this.startLive();
    this.persist();
    this.render();
  },

  /* ---- helpers (ported) --------------------------------------------- */
  presence() { return "avatars"; },
  accent() { return ACCENT; },
  gen(d) { return GEN[d % GEN.length]; },
  initials(n) { return (n || "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?"; },
  years(p) {
    if (!p) return "";
    if (p.born && p.died) return p.born + " – " + p.died;
    if (p.born) return "b. " + p.born;
    if (p.died) return "d. " + p.died;
    return "";
  },
  kidsOf(id) { return this.state.people.filter(p => p.parentId === id); },
  below(id) { return this.kidsOf(id).reduce((t, k) => t + 1 + this.below(k.id), 0); },
  depthOf(p) { let d = 0, cur = p; const by = id => this.state.people.find(x => x.id === id); while (cur && cur.parentId) { cur = by(cur.parentId); d++; if (d > 12) break; } return d; },
  newCode() {
    const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let out = "";
    for (let i = 0; i < 6; i++) out += a[Math.floor(Math.random() * a.length)];
    return out;
  },
  plusDays(n) {
    const d = new Date(Date.now() + n * 86400000);
    const mo = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][d.getMonth()];
    return mo + " " + d.getDate() + ", " + d.getFullYear();
  },
  stamp() {
    const d = new Date();
    const mo = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][d.getMonth()];
    let hh = d.getHours(), ap = hh >= 12 ? "PM" : "AM";
    hh = hh % 12 || 12;
    return mo + " " + d.getDate() + ", " + d.getFullYear() + " · " + hh + ":" + String(d.getMinutes()).padStart(2, "0") + " " + ap;
  },
  logEntry(st, verb, target, kind, detail, who, i, c) {
    return [{
      who: who || (st.myName || "You"), i: i || this.initials(st.myName || "You"), c: c || "#201e1d",
      verb, target, kind, detail: detail || null, when: this.stamp()
    }].concat(st.log);
  },
  flashToast() { clearTimeout(this._toastTimer); this._toastTimer = setTimeout(() => this.setState({ toast: null }), 4200); },

  startLive() {
    clearInterval(this._liveTimer);
    // simulated live collaborators only on the shared sample board
    if (this.state.room !== DEMO_ROOM) return;
    this._liveTimer = setInterval(() => this.liveTick(), 9000);
  },
  liveTick() {
    if (this.state.step !== "app" || this.state.room !== DEMO_ROOM) return;
    const ev = SCRIPT[this.state.tick % SCRIPT.length];
    this.setState(s => {
      let people = s.people.slice();
      let freshId = null;
      if (ev.person && !people.some(p => p.id === ev.person.id)) { people.push(clone(ev.person)); freshId = ev.person.id; }
      if (ev.patch) { people = people.map(p => p.id === ev.patch.id ? Object.assign({}, p, clone(ev.patch)) : p); freshId = ev.patch.id; }
      const fresh = Object.assign({}, s.fresh);
      if (freshId) fresh[freshId] = ev.who;
      return {
        people, fresh, tick: s.tick + 1,
        feed: [{ who: ev.who, i: ev.i, c: ev.c, text: ev.text, t: ev.t }].concat(s.feed),
        log: this.logEntry(s, ev.person ? "added" : "edited", ev.person ? ev.person.name : (ev.patch ? (s.people.find(p => p.id === ev.patch.id) || {}).name : ""), ev.person ? "add" : "edit", ev.logDetail || null, ev.who, ev.i, ev.c),
        toast: { text: ev.who + " " + ev.text, i: ev.i, c: ev.c }
      };
    });
    this.flashToast();
  },

  pushUndo() { this.setState(s => ({ undoStack: s.undoStack.slice(-9).concat([clone(s.people)]) })); },

  openNew(parentId) {
    this.pushUndo();
    this.setState({ sheet: "edit", editId: null, editIsNew: true, editParent: parentId, draftName: "", draftBorn: "", draftDied: "", draftPlace: "", draftNote: "", draftPartner: "", draftPartnerBorn: "", draftPartnerDied: "", draftPartnerPlace: "", draftMore: false });
  },
  openEdit(id) {
    const p = this.state.people.find(x => x.id === id);
    this.setState({
      sheet: "edit", editId: id, editIsNew: false,
      draftName: p.name, draftBorn: p.born || "", draftDied: p.died || "", draftPlace: p.place || "",
      draftNote: p.note || "", draftPartner: p.partner ? p.partner.name : "",
      draftPartnerBorn: p.partner && p.partner.born ? p.partner.born : "",
      draftPartnerDied: p.partner && p.partner.died ? p.partner.died : "",
      draftPartnerPlace: p.partner && p.partner.place ? p.partner.place : "",
      draftMore: !!p.partner
    });
  },
  saveEdit() {
    const s = this.state, name = s.draftName.trim();
    if (!name) return;
    const fields = {
      name, born: s.draftBorn, died: s.draftDied, place: s.draftPlace, note: s.draftNote,
      partner: s.draftPartner.trim() ? { name: s.draftPartner.trim(), born: s.draftPartnerBorn, died: s.draftPartnerDied, place: s.draftPartnerPlace } : null
    };
    this.pushUndo();
    this.setState(st => {
      let people, toastText, dupFound = null;
      if (st.editIsNew) {
        const dup = st.people.find(p => p.name.toLowerCase() === name.toLowerCase());
        dupFound = dup || null;
        const person = Object.assign({ id: "p" + Date.now(), parentId: st.editParent || null, addedBy: st.myName || "You" }, fields);
        if (dup) { person.flag = true; }
        people = st.people.map(p => (dup && p.id === dup.id) ? Object.assign({}, p, { flag: true }) : p).concat([person]);
        toastText = dup ? name + " added — flagged next to " + dup.name + " for a chat" : name + " is on the tree";
      } else {
        people = st.people.map(p => p.id === st.editId ? Object.assign({}, p, fields) : p);
        toastText = "Saved " + name;
      }
      return {
        people, sheet: null, selected: null,
        feed: [{ who: st.myName || "You", i: this.initials(st.myName || "You"), c: "#201e1d", text: (st.editIsNew ? "added " : "edited ") + name, t: this.clock() }].concat(st.feed),
        log: this.logEntry(st, st.editIsNew ? "added" : "edited", name, st.editIsNew ? "add" : "edit",
          st.editIsNew ? (dupFound ? "flagged as a possible duplicate" : null) : "details changed"),
        toast: { text: toastText, i: this.initials(st.myName || "You"), c: "#201e1d" }
      };
    });
    this.flashToast();
  },
  clock() { const d = new Date(); let hh = d.getHours() % 12 || 12; return hh + ":" + String(d.getMinutes()).padStart(2, "0"); },
  removePerson() {
    const id = this.state.deleteId;
    const ids = [id].concat(this.descendants(id));
    this.pushUndo();
    const gone = this.state.people.find(p => p.id === id);
    const extra = ids.length - 1;
    this.setState(s => ({
      people: s.people.filter(p => ids.indexOf(p.id) === -1),
      sheet: null, deleteId: null, selected: null,
      log: this.logEntry(s, "removed", gone ? gone.name : "someone", "remove",
        extra ? "and the " + extra + " " + (extra === 1 ? "person" : "people") + " below them" : null),
      toast: { text: "Removed. Undo brings them back.", i: "↶", c: "#8c491a" }
    }));
    this.flashToast();
  },
  descendants(id, out) {
    out = out || [];
    this.kidsOf(id).forEach(k => { out.push(k.id); this.descendants(k.id, out); });
    return out;
  },

  flatten(forBig, expandAll) {
    const s = this.state, q = s.query.trim().toLowerCase();
    const ind = forBig ? 42 : 21;
    // Indent per generation, but taper deep levels so long names keep a usable
    // width on a narrow phone. Connectors are derived from these offsets, so
    // they stay aligned whatever the taper.
    const cap = forBig ? 99 : 4, stepAfter = forBig ? ind : 8;
    const indentAt = d => d <= cap ? d * ind : cap * ind + (d - cap) * stepAfter;
    const stub = (a, b) => Math.max(6, Math.round((indentAt(a) - indentAt(b)) * 0.55));
    const rows = [];
    const matches = p => !q || [p.name, p.place, p.note, p.partner && p.partner.name, p.born, p.addedBy].filter(Boolean).join(" ").toLowerCase().indexOf(q) > -1;
    const walk = (parentId, depth) => {
      const list = this.kidsOf(parentId);
      list.forEach((p, i) => {
        const g = this.gen(depth);
        const collapsed = !expandAll && !!s.collapsed[p.id] && !q;
        const kids = this.kidsOf(p.id);
        const isFresh = !!s.fresh[p.id];
        const detail = [p.place, p.note].filter(Boolean).join(" · ");
        rows.push({
          isCard: true, isAdd: false, id: p.id, name: p.name, years: this.years(p),
          initials: this.initials(p.name), detail: detail,
          partnerName: p.partner ? p.partner.name : null,
          partnerYears: p.partner ? this.years(p.partner) : "",
          color: g.color, soft: g.soft, depth: depth, pad: indentAt(depth),
          ribLeft: depth ? indentAt(depth - 1) + 6 : 0, ribW: depth ? stub(depth, depth - 1) : Math.round(ind * 0.55),
          ribColor: this.gen(Math.max(0, depth - 1)).color,
          showRib: depth > 0, showSpine: depth > 0 && i < list.length - 1,
          borderColor: s.selected === p.id ? g.color : (isFresh ? this.accent() : (matches(p) && q ? g.color : "#dcd3c4")),
          borderW: s.selected === p.id ? 3 : (isFresh || (q && matches(p)) ? 2 : 1),
          dim: q && !matches(p) ? 0.32 : 1,
          hasKids: kids.length > 0, below: this.below(p.id),
          chevron: collapsed ? "▸" : "▾",
          selected: s.selected === p.id,
          flagged: !!p.flag,
          onFlag: () => this.setState({ sheet: "flag" }),
          byLine: isFresh ? "just added by " + s.fresh[p.id] : "added by " + (p.addedBy || "someone"),
          byColor: isFresh ? this.accent() : "#c0b6a5",
          onToggle: () => this.setState(st => ({ collapsed: Object.assign({}, st.collapsed, { [p.id]: !st.collapsed[p.id] }) })),
          onSelect: () => this.setState(st => ({ selected: st.selected === p.id ? null : p.id })),
          onAdd: () => this.openNew(p.id),
          onEdit: () => this.openEdit(p.id),
          onSibling: () => this.openNew(p.parentId),
          onDelete: () => this.setState({ sheet: "delete", deleteId: p.id })
        });
        if (!collapsed && kids.length) {
          walk(p.id, depth + 1);
          if (!forBig) {
            const cg = this.gen(depth + 1);
            rows.push({
              isCard: false, isAdd: true, id: p.id + "-add", pad: indentAt(depth + 1),
              ribLeft: indentAt(depth) + 6, ribW: stub(depth + 1, depth), ribColor: cg.color,
              showRib: true, showSpine: false, dim: 1, color: cg.color,
              label: "+ Add another child of " + p.name.split(" ")[0],
              onAdd: () => this.openNew(p.id)
            });
          }
        }
      });
    };
    walk(null, 0);
    return rows;
  },

  renderVals() {
    const s = this.state;
    const total = s.people.length + s.people.filter(p => p.partner && p.partner.name).length;
    const gens = s.people.reduce((m, p) => Math.max(m, this.depthOf(p) + 1), 1);
    const rows = this.flatten(false);
    const anyMatch = rows.some(r => r.isCard && r.dim === 1);
    const contributors = [
      { name: (s.myName || "You") + " (you)", i: this.initials(s.myName || "You"), c: "#201e1d", when: "now" },
      { name: "Rita", i: "R", c: "#c67139", when: "1m ago" },
      { name: "Tío Tomás", i: "T", c: "#7a8a5e", when: "2m ago" },

    const dupName = (s.editIsNew && s.draftName.trim())
      ? (s.people.find(p => p.name.toLowerCase() === s.draftName.trim().toLowerCase()) || {}).name : null;

      onLandingJoin: () => this.setState({ step: "name", joining: true }),

      },

      room: s.room, shared: s.shared,

      familyName: s.familyName,
      onFamilyName: e => this.setState({ familyName: e.target.value }),
      countLine: total + " people · " + gens + " gens",
      peopleCount: total,

      isProjection: s.projection,

      onExitProjection: () => this.setState({ projection: false }),
      bigRows: this.flatten(true),

      zoom: s.zoom, zoomLabel: Math.round(s.zoom * 100) + "%",
      onZoomIn: () => this.setState({ zoom: Math.min(1.5, +(s.zoom + 0.1).toFixed(2)) }),
      onZoomOut: () => this.setState({ zoom: Math.max(0.7, +(s.zoom - 0.1).toFixed(2)) }),
      onUndo: () => this.setState(st => st.undoStack.length
        ? { people: st.undoStack[st.undoStack.length - 1], undoStack: st.undoStack.slice(0, -1), log: this.logEntry(st, "undid", "the last change", "undo"), toast: { text: "Put back the way it was", i: "↶", c: "#7a8a5e" } }
        : { toast: { text: "Nothing to undo yet", i: "↶", c: "#82796a" } }, () => this.flashToast()),
      query: s.query,
      onQuery: e => this.setState({ query: e.target.value }),
      onExpandAll: () => this.setState({ collapsed: {} }),
      onCollapseAll: () => this.setState(st => {
        const c = {};
        st.people.forEach(p => { if (this.kidsOf(p.id).length) c[p.id] = true; });
        return { collapsed: c };
      }),
      legend: GEN.slice(0, Math.max(2, Math.min(GEN.length, gens))),
      rows: rows,
      noMatch: !!s.query.trim() && !anyMatch,
      onAddRoot: () => this.openNew(null),
      contributors: showContrib,
      feed: s.feed.slice(0, 6),
      sheetOpen: !!s.sheet,
      onCloseSheet: () => this.setState({ sheet: null, deleteId: null }),
      isLogSheet: s.sheet === "log",
      onOpenLog: () => this.setState({ sheet: "log" }),
      logCount: s.log.length,
      logFilters: [

      ].map(o => ({

        bd: s.logFilter === o.key ? this.accent() : "#dcd3c4",
        onPick: () => this.setState({ logFilter: o.key })
      })),
      logRows: s.log
        .filter(l => s.logFilter === "all" || l.kind === s.logFilter || (s.logFilter === "flag" && l.kind === "merge"))
        .map(l => ({

        })),

      })),

      },

          toast: { text: "Merged into " + pair[0].name + ". Everyone sees it now.", i: "✓", c: this.accent() }
        }), () => this.flashToast());
      },
      isEditSheet: s.sheet === "edit", isDeleteSheet: s.sheet === "delete",
      isBoardSheet: s.sheet === "board", isShareSheet: s.sheet === "share",
      isDownloadSheet: s.sheet === "download", isUpgradeSheet: s.sheet === "upgrade",
      onOpenBoard: () => this.setState({ sheet: "board" }),
      onOpenShare: () => this.setState({ sheet: "share" }),
      onOpenDownload: () => this.setState({ sheet: "download" }),

      onDownloadPdf: () => this.downloadTree("pdf", total),
      onDownloadImage: () => this.downloadImage(total),
      expiryDate: this.plusDays(3),

      planPerks: [

      ],
      payEmail: s.payEmail, payCard: s.payCard, payExp: s.payExp, payCvc: s.payCvc, payName: s.payName, payError: s.payError,

      onDraftPlace: e => this.setState({ draftPlace: e.target.value }),
      onDraftNote: e => this.setState({ draftNote: e.target.value }),
      onDraftPartner: e => this.setState({ draftPartner: e.target.value }),
      draftPartnerBorn: s.draftPartnerBorn, draftPartnerDied: s.draftPartnerDied, draftPartnerPlace: s.draftPartnerPlace,
      hasPartner: !!s.draftPartner.trim(),
      onDraftPartnerBorn: e => this.setState({ draftPartnerBorn: e.target.value }),
      onDraftPartnerDied: e => this.setState({ draftPartnerDied: e.target.value }),

      onToggleMore: () => this.setState({ draftMore: !s.draftMore }),

      deleteBody: delP ? (delP.name + " comes off the tree" + (delBelow ? ", along with the " + delBelow + " " + (delBelow === 1 ? "person" : "people") + " below them" : "") + (s.shared ? ", on everyone’s screen" : "") + ". Undo brings them back.") : "",
      onConfirmDelete: () => this.removePerson(),
      invite: "Help us build the " + s.familyName + " tree at the reunion.\n\n1. Open the link\n2. Tap “I have a code already”\n3. Type in the board code: " + s.room + "\n\nThen add the relatives you know best. Takes about two minutes.",
      onCopyInvite: () => { this.copy(this.renderVals().invite); this.setState({ sheet: null, toast: { text: "Message copied — paste it in the group text", i: "✓", c: "#7a8a5e" } }, () => this.flashToast()); },
      onTextIt: () => {

      },
      posterLine: "A printable sheet of all " + total + " people, in the order they sit on the tree.",
      toastText: s.toast ? s.toast.text : null,

    };

  copy(text) { try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (e) {} },

  downloadTree(kind, total) {
    // Real, free export: a self-contained printable HTML of the whole tree + log.
    const s = this.state;
    const rows = this.flatten(false, true).filter(r => r.isCard);
    const esc = t => String(t == null ? "" : t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const rowHtml = rows.map(r => `<div style="margin-left:${r.depth * 22}px;padding:8px 12px;border-left:5px solid ${r.color};margin-bottom:6px">
        <strong style="font-size:16px">${esc(r.name)}</strong> <span style="color:#82796a">${esc(r.years)}</span>
        ${r.partnerName ? ` &nbsp;♥ ${esc(r.partnerName)} <span style="color:#82796a">${esc(r.partnerYears)}</span>` : ""}
        ${r.detail ? `<div style="color:#645c50;font-size:13px">${esc(r.detail)}</div>` : ""}
        <div style="color:#c0b6a5;font-size:11px;text-transform:uppercase;letter-spacing:.08em">${esc(r.byLine)}</div>
      </div>`).join("");
    const logHtml = s.log.map(l => `<div style="padding:6px 0;border-top:1px solid #dcd3c4;font-size:13px"><strong>${esc(l.who)}</strong> ${esc(l.verb)} ${esc(l.target)}${l.detail ? ` — <span style="color:#645c50">${esc(l.detail)}</span>` : ""} <span style="color:#82796a;font-family:monospace;font-size:11px">${esc(l.when)}</span></div>`).join("");
    const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(s.familyName || "Family")} — Roundtable</title>
      <style>body{font-family:Georgia,serif;color:#201e1d;max-width:820px;margin:40px auto;padding:0 24px;background:#f5ead8}
      h1{font-size:38px;margin:0}h2{margin-top:40px}@media print{body{background:#fff}}</style></head>
      <body onload="${kind === 'pdf' ? 'window.print()' : ''}">
      <div style="text-transform:uppercase;letter-spacing:.16em;color:#8c491a;font-size:12px">Board ${esc(s.room)} · ${esc(total)} people</div>
      <h1>${esc(s.familyName || "Our Family")}</h1>
      <h2>The tree</h2>${rowHtml}
      <h2>Change log</h2>${logHtml}
      <p style="color:#82796a;font-size:12px;margin-top:30px">Made with Roundtable — the family tree you build together.</p>
      </body></html>`;
    const blob = new Blob([doc], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (s.familyName || "family").replace(/[^a-z0-9]+/gi, "-").toLowerCase() + "-tree.html";
    if (kind === "pdf") { window.open(url, "_blank"); }
    else { document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    this.setState(st => ({
      sheet: null,
      log: this.logEntry(st, "downloaded", kind === "pdf" ? "the tree as a PDF" : "the tree as an image", "export"),
      toast: { text: kind === "pdf" ? "Printable sheet opened — " + total + " people, log included" : "Tree saved — open it any time", i: "✓", c: this.accent() }
    }), () => this.flashToast());
  },

  // Renders the whole tree + change log to a real PNG (native SVG → canvas),
  // so "Download as image" produces an actual image of the tree. Falls back to
  // the printable HTML if the browser can't export the canvas.
  downloadImage(total) {
    const s = this.state;
    const rows = this.flatten(false, true).filter(r => r.isCard);
    const esc = t => String(t == null ? "" : t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const W = 980, P = 46, headTop = 58, treeTop = 132, rowH = 66, logRowH = 26;
    const logRows = s.log.slice(0, 40);
    const treeH = rows.length * rowH;
    const logTop = treeTop + treeH + 46;
    const H = logTop + 30 + logRows.length * logRowH + 44;
    let b = "";
    b += `<rect x="0" y="0" width="${W}" height="${H}" fill="#f5ead8"/>`;
    b += `<text x="${P}" y="${headTop}" font-family="Georgia,serif" font-weight="bold" font-size="40" fill="#201e1d">${esc(s.familyName || "Our Family")}</text>`;
    b += `<text x="${P}" y="${headTop + 30}" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#8c491a">BOARD ${esc(s.room)} · ${esc(total)} PEOPLE</text>`;
    rows.forEach((r, i) => {
      const y = treeTop + i * rowH;
      const x = P + Math.min(r.depth, 6) * 28;
      const midY = y + 23;
      b += `<rect x="${x}" y="${y}" width="6" height="${rowH - 16}" rx="3" fill="${r.color}"/>`;
      const ax = x + 32;
      b += `<circle cx="${ax}" cy="${midY}" r="17" fill="${r.soft}" stroke="${r.color}" stroke-width="2.5"/>`;
      b += `<text x="${ax}" y="${midY + 4}" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="12" fill="${r.color}">${esc(r.initials)}</text>`;
      const tx = ax + 30;
      b += `<text x="${tx}" y="${midY - 3}" font-family="Georgia,serif" font-weight="bold" font-size="20" fill="#201e1d">${esc(r.name)}<tspan font-family="Arial,sans-serif" font-weight="normal" font-size="12" fill="#82796a">   ${esc(r.years)}</tspan></text>`;
      const sub = [];
      if (r.partnerName) sub.push("♥ " + r.partnerName + (r.partnerYears ? " " + r.partnerYears : ""));
      if (r.detail) sub.push(r.detail);
      if (sub.length) b += `<text x="${tx}" y="${midY + 15}" font-family="Arial,sans-serif" font-size="12" fill="#645c50">${esc(sub.join("   ·   "))}</text>`;
      b += `<text x="${tx}" y="${midY + 31}" font-family="Arial,sans-serif" font-size="9" letter-spacing="1" fill="#c0b6a5">${esc((r.byLine || "").toUpperCase())}</text>`;
    });
    b += `<text x="${P}" y="${logTop}" font-family="Georgia,serif" font-weight="bold" font-size="22" fill="#201e1d">Change log</text>`;
    logRows.forEach((l, i) => {
      const y = logTop + 28 + i * logRowH;
      b += `<text x="${P}" y="${y}" font-family="Arial,sans-serif" font-size="13" fill="#201e1d"><tspan font-weight="bold">${esc(l.who)}</tspan> ${esc(l.verb)} ${esc(l.target)}<tspan fill="#82796a" font-size="11">   ${esc(l.when)}</tspan></text>`;
    });
    b += `<text x="${P}" y="${H - 20}" font-family="Arial,sans-serif" font-size="11" fill="#82796a">Made with Roundtable — the family tree you build together.</text>`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${b}</svg>`;
    const fname = ((s.familyName || "family").replace(/[^a-z0-9]+/gi, "-").toLowerCase().replace(/^-+|-+$/g, "") || "family") + "-tree.png";
    const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
    const finish = () => this.setState(st => ({
      sheet: null,
      log: this.logEntry(st, "downloaded", "the tree as an image", "export"),
      toast: { text: "Image saved — " + total + " people, log included", i: "✓", c: this.accent() }
    }), () => this.flashToast());
    const img = new Image();
    img.onload = () => {
      try {
        const scale = 2, canvas = document.createElement("canvas");
        canvas.width = W * scale; canvas.height = H * scale;
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => {
          if (!blob) { this.downloadTree("image", total); return; }
          const purl = URL.createObjectURL(blob);
          const a = document.createElement("a"); a.href = purl; a.download = fname;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(purl), 60000);
          finish();
        }, "image/png");
      } catch (e) { URL.revokeObjectURL(url); this.downloadTree("image", total); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); this.downloadTree("image", total); };
    img.src = url;
  }
};

    h("div", { style: "display:flex; gap:10px" },
      btn({ onClick: V.onKeepBoth, style: "flex:1; font-size:14px; font-weight:700; padding:15px; border-radius:999px; border:1.5px solid #7a8a5e; background:#f0fae1; color:#56633f; cursor:pointer" }, "Keep both for now"),
      btn({ onClick: V.onMerge, style: "flex:1; font-size:14px; font-weight:700; padding:15px; border-radius:999px; border:none; background:#c67139; color:#fff2eb; cursor:pointer" }, "Merge them")
    )

}

function boardSheet(V) {
  return h("div", { key: "sheet-board", style: SHEET + "; max-height:85%; gap:16px", class: "noscroll" },

      h("div", { style: "font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#8c491a" }, "Board code"),
      h("div", { style: "font-family:Caprasimo, serif; font-size:40px; letter-spacing:.16em; color:#8c491a; margin-top:4px" }, V.room),
      h("div", { style: "font-size:13px; color:#645c50; margin-top:8px; line-height:1.5" }, "Anyone who types this code joins the same tree.")
    ),
    h("div", { style: "display:flex; flex-direction:column; gap:10px" },
      h("div", { style: "font-family:Caprasimo, serif; font-size:19px" }, "Who's adding"),
      V.contributors.map((c, i) => h("div", { key: "co" + i, style: "display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-radius:20px; border:1.5px solid #dcd3c4" },
        h("div", { style: "display:flex; align-items:center; gap:11px" },
          h("div", { style: "width:32px; height:32px; border-radius:999px; background:" + c.c + "; color:#fff2eb; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center" }, c.i),
          h("div", { style: "font-size:14px; font-weight:700" }, c.name)
        ),

      ))
    ),
    h("div", { style: "display:flex; flex-direction:column; gap:9px" },
      h("div", { style: "font-family:Caprasimo, serif; font-size:19px" }, "Just happened"),
      V.feed.map((f, i) => h("div", { key: "fe" + i, style: "font-size:13px; line-height:1.45; color:#201e1d" },

    btn({ onClick: V.onCloseSheet, style: "font-size:15px; font-weight:700; padding:16px; border-radius:999px; border:1.5px solid #dcd3c4; background:transparent; color:#201e1d; cursor:pointer" }, "Back to the tree")
  );
}

function shareSheet(V) {
  return h("div", { key: "sheet-share", style: SHEET + "; max-height:85%; gap:15px", class: "noscroll" },
    GRAB,
    h("div", { style: "font-family:Caprasimo, serif; font-size:24px" }, "Send the code to family"),
    h("div", { style: "padding:16px; border-radius:24px; background:#ffe1d0; text-align:center" },
      h("div", { style: "font-family:Caprasimo, serif; font-size:36px; letter-spacing:.16em; color:#8c491a" }, V.room)
    ),
    h("div", { style: "padding:16px; border-radius:20px; border:1.5px solid #dcd3c4; background:#f5ead8; font-size:13px; line-height:1.6; color:#201e1d; white-space:pre-wrap" }, V.invite),
    h("div", { style: "display:flex; gap:9px; flex-wrap:wrap" },
      btn({ onClick: V.onCopyInvite, style: "flex:1; min-width:120px; font-size:14px; font-weight:700; padding:14px; border-radius:999px; border:none; background:#c67139; color:#fff2eb; cursor:pointer" }, "Copy message"),
      btn({ onClick: V.onTextIt, style: "flex:1; min-width:120px; font-size:14px; font-weight:700; padding:14px; border-radius:999px; border:1.5px solid #dcd3c4; background:transparent; color:#201e1d; cursor:pointer" }, "Text it")

  );
}

function closeX(onClick) {
  return btn({ onClick, style: "flex:none; width:44px; height:44px; border-radius:999px; border:none; background:#ebddc5; color:#201e1d; font-size:19px; font-weight:700; cursor:pointer", hover: "background:#dcd3c4" }, "✕");
}

function logSheet(V) {
  return h("div", { key: "sheet-log", style: SHEET + "; max-height:90%; gap:14px", class: "noscroll" },
    GRAB,
    h("div", { style: "display:flex; align-items:flex-start; justify-content:space-between; gap:14px" },
      h("div", { style: "display:flex; flex-direction:column; gap:5px" },
        h("div", { style: "font-family:Caprasimo, serif; font-size:24px; line-height:1.1" }, "Everything that's happened"),
        h("div", { style: "font-size:13px; line-height:1.5; color:#645c50" }, "Every add, edit and removal on board " + V.room + ", with who did it and when. Nobody can quietly take a relative off the tree.")
      ),
      closeX(V.onCloseSheet)
    ),
    h("div", { style: "display:flex; gap:7px; flex-wrap:wrap" },
      V.logFilters.map(fl => btn({ key: fl.key, onClick: fl.onPick, style: "font-size:12px; font-weight:700; padding:8px 14px; border-radius:999px; cursor:pointer; background:" + fl.bg + "; color:" + fl.fg + "; border:1.5px solid " + fl.bd }, fl.label))
    ),
    h("div", { style: "display:flex; flex-direction:column" },
      V.logRows.map((l, i) => h("div", { key: "lr" + i, style: "display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1.5px solid #dcd3c4" },
        h("div", { style: "width:30px; height:30px; flex:none; border-radius:999px; background:" + l.c + "; color:#fff2eb; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center" }, l.i),

            h("span", { style: "font-weight:700; color:" + l.verbColor }, l.verb), " " + l.target

  const body = V.isPaid
    ? h("div", { style: "display:flex; flex-direction:column; gap:14px" },

          h("div", { style: "font-size:13px; font-weight:800; color:#3d472b" }, "This board stays live"),
          h("div", { style: "font-size:13px; line-height:1.5; color:#56633f" }, "Renews " + V.renewDate + " · receipt sent to " + V.payEmail)
        ),

          h("div", { style: "font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#82796a" }, "Your family link"),
          h("div", { style: "padding:15px 18px; border-radius:20px; border:1.5px solid #dcd3c4; background:#f5ead8; font-family:'IBM Plex Mono', monospace; font-size:13px; color:#201e1d; overflow:hidden; text-overflow:ellipsis" }, V.liveLink)
        ),
        btn({ onClick: V.onCopyLink, style: "font-size:15px; font-weight:800; padding:16px; border-radius:999px; border:none; background:#c67139; color:#fff2eb; cursor:pointer", hover: "background:#b2622d" }, "Copy the link"),
        btn({ onClick: V.onCloseSheet, style: "font-size:14px; font-weight:700; padding:14px; border-radius:999px; border:1.5px solid #dcd3c4; background:transparent; color:#645c50; cursor:pointer" }, "Done"),
        h("div", { style: "font-size:11px; line-height:1.5; color:#82796a; text-align:center" }, "Cancel any time from the receipt email. Downloads stay free.")
      )
    : h("div", { style: "display:flex; flex-direction:column; gap:14px" },
        h("div", { style: "padding:14px 16px; border-radius:20px; background:#ffe1d0; border:1.5px solid #f6a06b; font-size:13px; line-height:1.5; color:#8c491a" },
          "Right now this board is free — the link goes dark on ", h("span", { style: "font-weight:800" }, V.expiryDate), ", three days from today."),
        h("div", { style: "display:flex; flex-direction:column; gap:8px" },
          V.planPerks.map((p, i) => h("div", { key: "pk" + i, style: "display:flex; align-items:flex-start; gap:10px" },
            h("span", { style: "width:20px; height:20px; flex:none; border-radius:999px; background:#7a8a5e; color:#f0fae1; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center" }, "✓"),
            h("span", { style: "font-size:13px; line-height:1.45; color:#201e1d" }, p)
          ))
        ),
        h("div", { style: "display:flex; flex-direction:column; gap:10px" },
          h("div", { style: "font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#82796a" }, "Where the link goes"),
          inp({ value: V.payEmail, onChange: V.onPayEmail, placeholder: "you@email.com", style: "font-size:16px; padding:15px 18px; border-radius:999px; border:1.5px solid #dcd3c4; background:#f5ead8; color:#201e1d; outline:none" }),
          h("div", { style: "font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#82796a; margin-top:4px" }, "Card"),
          inp({ value: V.payCard, onChange: V.onPayCard, placeholder: "Card number", style: "font-size:16px; padding:15px 18px; border-radius:999px; border:1.5px solid #dcd3c4; background:#f5ead8; color:#201e1d; outline:none" }),
          h("div", { style: "display:flex; gap:10px" },
            inp({ value: V.payExp, onChange: V.onPayExp, placeholder: "MM / YY", style: "flex:1; min-width:0; font-size:16px; padding:15px 18px; border-radius:999px; border:1.5px solid #dcd3c4; background:#f5ead8; color:#201e1d; outline:none" }),
            inp({ value: V.payCvc, onChange: V.onPayCvc, placeholder: "CVC", style: "flex:1; min-width:0; font-size:16px; padding:15px 18px; border-radius:999px; border:1.5px solid #dcd3c4; background:#f5ead8; color:#201e1d; outline:none" })

        ),
        h("div", { style: "display:flex; align-items:baseline; justify-content:space-between; padding:14px 18px; border-radius:20px; background:#ebddc5" },
          h("div", { style: "font-size:13px; font-weight:700; color:#645c50" }, "Roundtable, one family"),

        ),
        V.payError ? h("div", { style: "font-size:13px; font-weight:700; color:#8c491a" }, V.payError) : null,
        btn({ onClick: V.onSubscribe, style: "font-size:16px; font-weight:800; padding:17px; border-radius:999px; border:none; background:#c67139; color:#fff2eb; cursor:pointer", hover: "background:#b2622d" }, "Keep it live — $19.99 a year"),
        btn({ onClick: V.onCloseSheet, style: "font-size:14px; font-weight:700; padding:14px; border-radius:999px; border:1.5px solid #dcd3c4; background:transparent; color:#645c50; cursor:pointer" }, "Not now — let it expire in 3 days"),
        h("div", { style: "font-size:11px; line-height:1.5; color:#82796a; text-align:center" }, "Cancel any time. The PDF and image downloads stay free either way.")
      );

  return h("div", { key: "sheet-up", style: SHEET + "; max-height:92%; gap:14px", class: "noscroll" },
    GRAB,
    h("div", { style: "display:flex; align-items:flex-start; justify-content:space-between; gap:14px" },
      h("div", { style: "display:flex; flex-direction:column; gap:5px" },
        h("div", { style: "font-family:Caprasimo, serif; font-size:25px; line-height:1.08" }, V.upgradeTitle),
        h("div", { style: "font-size:13px; line-height:1.5; color:#645c50" }, V.upgradeSub)
      ),
      closeX(V.onCloseSheet)
    ),
    body
  );
}

/* ------------------------------ boot ------------------------------------- */
(function () {
  App._root = document.getElementById("device");
  // seed the sample board once so first-time visitors can explore it
  if (!localStorage.getItem(STORE_PREFIX + DEMO_ROOM)) {
    localStorage.setItem(STORE_PREFIX + DEMO_ROOM, JSON.stringify({
      familyName: SEED.familyName, people: SEED.people, feed: SEED.feed, log: SEED.log, thread: SEED.thread, fresh: {}, collapsed: {}, subscribed: false
    }));
  }
  // resume last session
  try {
    const sess = JSON.parse(localStorage.getItem("roundtable:session") || "null");
    if (sess && sess.myName) App.state.myName = sess.myName;
    if (sess && sess.step === "app" && sess.room) {
      App.state.step = "landing"; // will enter cleanly below
      App.enterRoom(sess.room, false);
      App.state.myName = sess.myName || App.state.myName;
    }
  } catch (e) {}
  App.render();
  if (App.state.step === "app") App.startLive();
})();
</script>
